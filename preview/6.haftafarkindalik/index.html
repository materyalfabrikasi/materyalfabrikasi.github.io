<script>
/* Native desktop drag-and-drop support; pointer dragging remains for touch. */
let nativeDraggedWagon=null;
const renderSortStage=sort;
sort=function(){
  renderSortStage();
  scene.querySelectorAll('.bank .wagon').forEach(w=>{
    w.draggable=false;
    w.onpointerdown=e=>{
      if(e.pointerType==='mouse'&&e.button!==0)return;
      e.preventDefault();select(w);
      const r=w.getBoundingClientRect(),dx=e.clientX-r.left,dy=e.clientY-r.top;
      const placeholder=document.createElement('div');
      placeholder.className='wagon-placeholder';placeholder.style.width=r.width+'px';placeholder.style.height=r.height+'px';
      w.after(placeholder);w.classList.add('dragging');w.style.left=r.left+'px';w.style.top=r.top+'px';document.body.append(w);scene.classList.add('drag-active');
      const correctSlot=scene.querySelector(`[data-slot="${w.dataset.n}"]`);correctSlot?.classList.add('drop-target');
      const move=v=>{
        v.preventDefault();
        w.classList.add('dragging');
        w.style.left=v.clientX-dx+'px';w.style.top=v.clientY-dy+'px';
        scene.querySelectorAll('.slot').forEach(slot=>slot.classList.remove('drop-hover'));
        const hover=[...scene.querySelectorAll('.slot')].find(s=>{const b=s.getBoundingClientRect();return v.clientX>=b.left-12&&v.clientX<=b.right+12&&v.clientY>=b.top-12&&v.clientY<=b.bottom+12});
        hover?.classList.add('drop-hover');
      };
      const finish=v=>{
        document.removeEventListener('pointermove',move,true);
        document.removeEventListener('pointerup',finish,true);
        document.removeEventListener('pointercancel',cancel,true);
        const target=[...scene.querySelectorAll('.slot')].find(s=>{
          const b=s.getBoundingClientRect();
          return v.clientX>=b.left-18&&v.clientX<=b.right+18&&v.clientY>=b.top-18&&v.clientY<=b.bottom+18;
        });
        w.classList.remove('dragging');w.style.left=w.style.top='';scene.classList.remove('drag-active');
        scene.querySelectorAll('.slot').forEach(slot=>slot.classList.remove('drop-target','drop-hover'));
        /* Vagon yalnızca place() başarı bildirdiğinde havuzdan çıkar. */
        const placed=target ? place(w,target) : false;
        if(placed)placeholder.remove();
        else placeholder.replaceWith(w);
      };
      const cancel=()=>{
        document.removeEventListener('pointermove',move,true);
        document.removeEventListener('pointerup',finish,true);
        document.removeEventListener('pointercancel',cancel,true);
        w.classList.remove('dragging');w.style.left=w.style.top='';placeholder.replaceWith(w);scene.classList.remove('drag-active');
        scene.querySelectorAll('.slot').forEach(slot=>slot.classList.remove('drop-target','drop-hover'));
      };
      document.addEventListener('pointermove',move,true);
      document.addEventListener('pointerup',finish,true);
      document.addEventListener('pointercancel',cancel,true);
    };
    w.ondragstart=e=>{
      nativeDraggedWagon=w;
      select(w);
      w.classList.add('dragging-native');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',w.dataset.n);
    };
    w.ondragend=()=>{
      w.classList.remove('dragging-native');
      nativeDraggedWagon=null;
    };
  });
  scene.querySelectorAll('.slot').forEach(s=>{
    s.ondragover=e=>{e.preventDefault();e.dataTransfer.dropEffect='move';s.classList.add('drop-ready')};
    s.ondragleave=()=>s.classList.remove('drop-ready');

  });

</script>
<script>
/* Rhythmic steam-engine "chuff-chuff" while the train is moving. */
function steamPuff(at,strong=false){
  const duration=.24;
  const duck=numberSpeaking ? .72 : 1;
  const buffer=ac.createBuffer(1,Math.floor(ac.sampleRate*duration),ac.sampleRate);
  const samples=buffer.getChannelData(0);
  let smooth=0;
  for(let i=0;i<samples.length;i++){
    smooth=.72*smooth+.28*(Math.random()*2-1);
    samples[i]=smooth*(1-i/samples.length);
  }
  const noise=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();
  noise.buffer=buffer;filter.type='bandpass';filter.frequency.value=strong?720:860;filter.Q.value=.7;
  gain.gain.setValueAtTime(.0001,at);
  gain.gain.exponentialRampToValueAtTime((strong ? .105 : .085)*duck,at+.025);
  gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
  noise.connect(filter).connect(gain).connect(ac.destination);noise.start(at);noise.stop(at+duration);
  const thump=ac.createOscillator(),thumpGain=ac.createGain();
  thump.type='sine';thump.frequency.setValueAtTime(strong?92:108,at);thump.frequency.exponentialRampToValueAtTime(54,at+.16);
  thumpGain.gain.setValueAtTime(.0001,at);thumpGain.gain.exponentialRampToValueAtTime(.065*duck,at+.018);thumpGain.gain.exponentialRampToValueAtTime(.0001,at+.19);
  thump.connect(thumpGain).connect(ac.destination);thump.start(at);thump.stop(at+.2);
}
chuffOnce=function(){
  if(!S.sound)return;
  audio();const now=ac.currentTime;
  steamPuff(now,true);steamPuff(now+.29,false);
};
startChuff=function(){
  stopChuff();chuffOnce();chuffTimer=setInterval(chuffOnce,820);
};
</script>
<script>
/* Accept correctly positioned wagons in any order. */
place=function(w,s){
  const n=+w.dataset.n,p=+s.dataset.slot;
  if(n===p&&!s.children.length){
    s.append(w);w.classList.remove('selected');w.style.pointerEvents='none';S.selected=null;speak(n);
    const empty=[...scene.querySelectorAll('.slot')].find(slot=>!slot.children.length);
    S.expected=empty ? +empty.dataset.slot : (S.round?11:6);
    if(!empty){
      later(()=>{
        if(!S.round){S.round=1;msg('İlk tur tamam!');later(sort,800)}else done();
      },350);
    }
    return true;
  }else{
    tone(300);msg(n===p?'Bu yuva dolu!':'Vagonu kendi sırasına bırak!',0);
    const correct=scene.querySelector(`[data-slot="${n}"]`);
    correct?.classList.add('hint');later(()=>correct?.classList.remove('hint'),900);
    return false;
  }
};
hint=function(){
  const empty=[...scene.querySelectorAll('.slot')].find(slot=>!slot.children.length);
  if(!empty)return;
  empty.classList.add('hint');speak(empty.dataset.slot);later(()=>empty.classList.remove('hint'),900);
};
</script>
<script>

<script>

  speak(S.count);bar(S.count*3.3);

</script>
<script>

  if(videoCompletionStarted)return;
  videoCompletionStarted=true;buildConfetti();finish();
}

  clear();bar(100);screens('videoScreen');
  const video=document.querySelector('#finalVideo');
  videoCompletionStarted=false;
  if(video){video.currentTime=0;video.onended=completeAfterVideo;video.play().catch(()=>{})}
}

  if(S.stage!==3){standardDone();return}

  const box=document.querySelector('#confetti');
  if(!box||box.children.length)return;
  const colors=['#ef8437','#f4c84f','#65b795','#58a9d8','#e77791'];
  for(let i=0;i<42;i++){
    const piece=document.createElement('i');
    piece.style.setProperty('--x',(Math.random()*100)+'%');
    piece.style.setProperty('--c',colors[i%colors.length]);
    piece.style.setProperty('--d',(2.8+Math.random()*2.3)+'s');
    piece.style.setProperty('--delay',(-Math.random()*4)+'s');
    piece.style.setProperty('--drift',(-90+Math.random()*180)+'px');
    piece.style.setProperty('--r',(Math.random()*180)+'deg');
    box.append(piece);
  }

    audio();ac?.resume?.();
    lastNumber=0;lastNumberAt=0;
