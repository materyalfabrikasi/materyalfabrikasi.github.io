<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Farkındalık Tohum</title>
  <style>
    :root{--lacivert:#103d6d;--mavi:#37a9d0;--acik:#eaf8fd;--sari:#ffd44d;--yesil:#2eaa68;--kirmizi:#e30a17;--golge:0 16px 38px rgba(25,83,122,.16)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none}body{position:fixed;inset:0;background:#7adcf1;color:var(--lacivert);font-family:Arial,Helvetica,sans-serif}button,select{font:inherit}button{-webkit-tap-highlight-color:transparent}
    .opening{position:relative;width:min(100vw,calc(100vh * 2.062));height:min(100vh,calc(100vw / 2.062));margin:auto;top:50%;transform:translateY(-50%)}
    .opening img{display:block;width:100%;height:100%;object-fit:contain}.opening-start{position:absolute;left:40.7%;top:71.2%;width:18.6%;height:12%;border:0;border-radius:25px;background:transparent;cursor:pointer}.opening-start:focus-visible{outline:6px solid #0a4b81;outline-offset:4px}.opening-start:active{transform:scale(.97)}
    .app{display:none;width:100%;height:100dvh;max-height:100%;overflow:hidden;padding:clamp(8px,1.2vw,18px);background:radial-gradient(circle at 10% 15%,rgba(255,213,91,.24),transparent 22%),radial-gradient(circle at 90% 85%,rgba(47,178,211,.2),transparent 25%),linear-gradient(135deg,#eaf9ff,#fffdf7 55%,#e2f5fb)}.app.active{display:block}
    .view{display:none;width:100%;height:100%;min-height:0;overflow:hidden;animation:giris .45s ease}.view.active{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.2vh,14px)}
    h1,h2,p{margin:0}.title{padding:10px 28px;border-radius:24px;background:rgba(255,255,255,.84);box-shadow:var(--golge);font-size:clamp(28px,4vw,56px);line-height:1;text-align:center}.instruction{display:flex;align-items:center;gap:12px;font-size:clamp(22px,2.6vw,38px);font-weight:800;text-align:center}.speaker{width:58px;height:58px;border:0;border-radius:50%;background:#fff;color:var(--lacivert);box-shadow:0 6px 0 #b9dbe7;cursor:pointer;font-size:27px}.speaker:active{transform:translateY(4px);box-shadow:0 2px 0 #b9dbe7}
    .back-button{position:fixed;top:10px;left:10px;z-index:55;min-width:112px;min-height:44px;padding:7px 15px;border:2px solid #fff;border-radius:15px;background:linear-gradient(135deg,#278fb7,#17679b);color:#fff;font-weight:800;box-shadow:0 5px 0 #0d527b;cursor:pointer}.back-button:active{transform:translateY(3px);box-shadow:0 2px 0 #0d527b}
    .color-head{display:flex;align-items:center;justify-content:center;gap:14px;width:min(96vw,1200px);min-height:70px}.color-head .title{flex:0 1 auto}.reference-card{display:flex;align-items:center;gap:8px;height:68px;padding:6px 10px;border:2px solid #fff;border-radius:18px;background:rgba(255,255,255,.92);box-shadow:0 8px 20px rgba(25,83,122,.14);font-size:12px;font-weight:800}.reference-card img{display:block;width:90px;height:56px;object-fit:contain;border-radius:7px}
    .flag-card img,.country-card img,.final-flag img,.reference-card img{filter:saturate(1.16) contrast(1.06)}
    .warm-grid{display:grid;grid-template-columns:repeat(2,minmax(240px,430px));gap:clamp(14px,2vw,26px);width:min(92vw,920px)}.flag-card{min-height:170px;padding:12px;border:4px solid transparent;border-radius:26px;background:#fff;box-shadow:var(--golge);cursor:pointer;transition:.2s;overflow:hidden}.flag-card:hover{transform:translateY(-3px)}.flag-card svg,.flag-card img{display:block;width:100%;height:100%;max-height:200px;object-fit:contain}.flag-card.correct{animation:dogru .65s ease;border-color:#55be80}.flag-card.try{animation:salla .38s ease}
    .progress{display:flex;gap:9px}.dot{width:14px;height:14px;border-radius:50%;background:#c8dce6}.dot.on{background:#2d9fc6;transform:scale(1.15)}
    .color-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,330px);gap:clamp(12px,1.8vw,24px);align-items:center;width:min(96vw,1200px);height:calc(100% - 82px);min-height:0}.flag-stage{display:grid;place-items:center;min-height:0;max-height:100%;padding:clamp(8px,1.2vw,15px);border-radius:30px;background:rgba(255,255,255,.86);box-shadow:var(--golge)}.flag-stage svg,.flag-stage img{display:block;width:100%;max-height:min(55vh,100%);object-fit:contain;filter:drop-shadow(0 12px 16px rgba(28,61,85,.17))}.paint-region{cursor:pointer;transition:filter .2s}.paint-region:hover{filter:brightness(1.05)}.paint-region.good{animation:parla .6s ease}.paint-region.again{animation:salla .38s ease;transform-box:fill-box;transform-origin:center}
    .paint-controls{display:flex;flex-direction:column;align-items:center;gap:10px}.palette{display:grid;grid-template-columns:repeat(4,66px);gap:10px;padding:12px;border-radius:26px;background:rgba(255,255,255,.9);box-shadow:var(--golge)}.swatch{position:relative;width:66px;height:92px;border:0;background:transparent;box-shadow:none;cursor:pointer;transition:transform .18s}.swatch::before{content:"";position:absolute;top:2px;left:7px;width:52px;height:68px;border:4px solid rgba(16,61,109,.22);border-radius:12px 12px 18px 18px;background:linear-gradient(90deg,rgba(255,255,255,.42),transparent 30%,rgba(0,0,0,.16) 82%),var(--c);clip-path:polygon(8% 0,92% 0,100% 76%,78% 100%,22% 100%,0 76%);box-shadow:0 6px 9px rgba(16,61,109,.18)}.swatch::after{content:"";position:absolute;left:15px;bottom:2px;width:36px;height:20px;border:4px solid #67849a;border-radius:6px;background:linear-gradient(#f8fbfd,#cbd9e2);box-shadow:0 4px 0 rgba(16,61,109,.18)}.tube-check{position:absolute;z-index:2;top:22px;left:19px;display:none;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--lacivert);font-size:20px;font-weight:900;box-shadow:0 2px 6px rgba(0,0,0,.2)}.swatch[aria-pressed=true]{transform:translateY(-5px)}.swatch[aria-pressed=true]::before{border-color:var(--lacivert);box-shadow:0 0 0 5px rgba(55,169,208,.2),0 8px 10px rgba(16,61,109,.24)}.swatch[aria-pressed=true] .tube-check{display:grid}.feedback{min-height:20px;font-size:clamp(20px,2vw,28px);font-weight:800;text-align:center}.next{min-width:210px;min-height:60px;padding:10px 24px;border:2px solid #fff;border-radius:20px;background:linear-gradient(135deg,#218bb6,#17669a);color:#fff;font-size:clamp(19px,2vw,27px);font-weight:800;box-shadow:0 7px 0 #0e527b;cursor:pointer}.next[hidden]{display:none}.next:disabled{background:#b7c7cf;color:#eef3f5;box-shadow:0 5px 0 #8fa4ae;cursor:not-allowed;opacity:.82}.next:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 #0e527b}
    .country-view{justify-content:flex-start!important;padding-top:clamp(46px,6vh,64px)}.country-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));flex:1;min-height:0;gap:10px;width:min(98vw,1400px);overflow:hidden;padding:4px 10px 10px}.country-card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-width:0;min-height:0;padding:7px;border:3px solid #fff;border-radius:20px;background:#fff;box-shadow:0 8px 20px rgba(25,83,122,.13);color:var(--lacivert);font-size:clamp(13px,1.05vw,17px);font-weight:800;cursor:pointer;overflow:hidden}.country-card:hover,.country-card:focus-visible{border-color:#f1b832;transform:translateY(-2px)}.country-card svg,.country-card img{width:100%;height:clamp(48px,10vh,88px);min-height:0;object-fit:contain}
    .final-flags{display:grid;grid-template-columns:1fr 1fr;gap:clamp(22px,4vw,60px);width:min(94vw,1200px)}.final-flag{padding:20px;border-radius:28px;background:#fff;box-shadow:var(--golge);text-align:center;overflow:hidden}.final-flag svg,.final-flag img{display:block;width:100%;height:260px;object-fit:contain}.final-flag h2{margin-top:10px;font-size:clamp(24px,3vw,42px)}.final-actions{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center}.complete-badge{min-height:60px;padding:13px 26px;border:2px solid #fff;border-radius:20px;background:linear-gradient(135deg,#42b978,#258f5c);color:#fff;font-size:clamp(19px,2vw,27px);font-weight:900;box-shadow:0 7px 0 #197247}
    #videoView{position:relative;isolation:isolate;background:linear-gradient(135deg,#dff8ff,#fff8d9 52%,#d7f3ff)}#videoView::before,#videoView::after{content:"";position:absolute;z-index:-1;width:70vmax;height:70vmax;border-radius:42% 58% 64% 36%/43% 38% 62% 57%;filter:blur(28px);opacity:.78;will-change:transform,border-radius;pointer-events:none}#videoView::before{left:-30vmax;top:-35vmax;background:radial-gradient(circle at 34% 32%,#55d7eb 0 24%,#2aa9d3 45%,rgba(42,169,211,0) 72%);animation:akisBir 12s ease-in-out infinite alternate}#videoView::after{right:-31vmax;bottom:-38vmax;background:radial-gradient(circle at 48% 44%,#ffd75b 0 20%,#63dfc3 43%,rgba(99,223,195,0) 72%);animation:akisIki 15s ease-in-out infinite alternate}.flower-layer{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}.flower-particle{position:absolute;top:-12vh;left:var(--left);font-size:var(--size);opacity:var(--opacity);filter:drop-shadow(0 3px 3px rgba(16,61,109,.16));animation:cicekAkisi var(--duration) linear var(--delay) infinite;will-change:transform}.video-card{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;width:min(94vw,1100px);max-height:calc(100vh - 105px);padding:14px;border:1px solid rgba(255,255,255,.8);border-radius:28px;background:rgba(255,255,255,.9);box-shadow:0 18px 48px rgba(16,61,109,.22);backdrop-filter:blur(10px)}.video-card video{display:block;width:100%;max-height:calc(100vh - 245px);border-radius:18px;background:#000;object-fit:contain}.video-controls{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}.video-control{min-width:150px;min-height:52px;padding:8px 18px;border:2px solid #fff;border-radius:17px;background:linear-gradient(135deg,#278fb7,#17679b);color:#fff;font-size:clamp(17px,1.6vw,23px);font-weight:800;box-shadow:0 6px 0 #0d527b;cursor:pointer}.video-control:active{transform:translateY(4px);box-shadow:0 2px 0 #0d527b}
    .completion-card{display:flex;flex-direction:column;align-items:center;gap:22px;width:min(90vw,760px);padding:clamp(34px,6vw,72px);border:4px solid #fff;border-radius:42px;background:linear-gradient(145deg,rgba(255,255,255,.96),rgba(232,251,255,.94));box-shadow:0 22px 60px rgba(16,61,109,.24);text-align:center}.completion-icon{font-size:clamp(70px,10vw,130px);line-height:1}.completion-card h1{font-size:clamp(38px,6vw,76px);color:#17895a}.completion-card p{font-size:clamp(24px,3vw,42px);font-weight:900;color:var(--lacivert)}
    .final-actions .next,.video-card .next,.completion-card .next{min-width:165px;min-height:48px;padding:8px 18px;border-radius:15px;font-size:clamp(16px,1.45vw,21px);box-shadow:0 5px 0 #0e527b}.final-actions .next:active,.video-card .next:active,.completion-card .next:active{transform:translateY(3px);box-shadow:0 2px 0 #0e527b}.video-control{min-width:118px;min-height:43px;padding:6px 13px;border-radius:13px;font-size:clamp(14px,1.2vw,18px);box-shadow:0 4px 0 #0d527b}.complete-badge{min-height:48px;padding:10px 18px;border-radius:15px;font-size:clamp(16px,1.45vw,21px);box-shadow:0 5px 0 #197247}
    .teacher{display:none}.teacher summary{padding:10px 14px;font-size:14px;font-weight:800;cursor:pointer;list-style:none}.teacher summary::-webkit-details-marker{display:none}.tools{display:grid;gap:8px;padding:0 11px 11px}.tools label{display:grid;gap:4px;font-size:13px;font-weight:700}.tools select,.tool{min-height:42px;border:2px solid #c6e0ea;border-radius:11px;background:#f8fdff;color:var(--lacivert);font-weight:800;cursor:pointer}.tool-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .confetti-layer{position:fixed;inset:0;z-index:80;pointer-events:none;overflow:hidden}.confetti{position:absolute;top:-24px;width:11px;height:18px;border-radius:3px;animation:konfeti 1.8s ease-out forwards}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @keyframes giris{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}@keyframes salla{35%{transform:translateX(-6px)}70%{transform:translateX(6px)}}@keyframes dogru{45%{transform:scale(1.04);box-shadow:0 0 0 8px rgba(85,190,120,.23)}}@keyframes parla{45%{filter:drop-shadow(0 0 14px rgba(65,190,120,.9))}}@keyframes konfeti{0%{opacity:0;transform:translateY(-20px) rotate(0)}10%{opacity:1}100%{opacity:0;transform:translate(var(--x),105vh) rotate(var(--r))}}@keyframes akisBir{0%{transform:translate(0,0) rotate(0) scale(1);border-radius:42% 58% 64% 36%/43% 38% 62% 57%}100%{transform:translate(25vmax,16vmax) rotate(24deg) scale(1.12);border-radius:60% 40% 38% 62%/36% 58% 42% 64%}}@keyframes akisIki{0%{transform:translate(0,0) rotate(0) scale(1.08);border-radius:55% 45% 36% 64%/60% 35% 65% 40%}100%{transform:translate(-23vmax,-15vmax) rotate(-28deg) scale(.96);border-radius:36% 64% 58% 42%/42% 62% 38% 58%}}@keyframes cicekAkisi{0%{transform:translate3d(0,-10vh,0) rotate(0deg)}50%{transform:translate3d(var(--drift),55vh,0) rotate(180deg)}100%{transform:translate3d(var(--drift-back),118vh,0) rotate(380deg)}}
    @media(max-width:900px){.color-layout{grid-template-columns:1fr;height:calc(100% - 72px)}.flag-stage svg,.flag-stage img{max-height:38vh}.paint-controls{gap:4px}.palette{grid-template-columns:repeat(7,48px);gap:5px;padding:7px}.swatch{width:48px;height:70px}.swatch::before{left:5px;width:38px;height:50px;border-width:3px}.swatch::after{left:11px;width:26px;height:15px;border-width:3px}.tube-check{top:15px;left:14px;width:21px;height:21px;font-size:15px}.country-grid{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(6,minmax(0,1fr));gap:6px}.country-card{padding:4px}.country-card img{height:clamp(30px,6vh,55px)}.final-flag svg,.final-flag img{height:180px}}
    @media(max-width:620px){.warm-grid{grid-template-columns:1fr 1fr}.flag-card{min-height:110px}.palette{grid-template-columns:repeat(7,40px);gap:3px}.swatch{width:40px;height:62px}.swatch::before{left:4px;width:32px;height:44px}.swatch::after{left:9px;width:22px;height:13px}.tube-check{top:13px;left:11px;width:19px;height:19px;font-size:13px}.final-flags{grid-template-columns:1fr}.final-flag svg,.final-flag img{height:130px}.title{font-size:26px}.teacher{max-width:220px}.back-button{min-width:78px;min-height:40px;padding:6px 9px}.reference-card span{display:none}.reference-card img{width:70px;height:48px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
  </style>
</head>
<body>
  <main class="opening" id="opening">
    <img src="acilis-ekrani.png" alt="Ülkem Yanımda Türkçe ve Türk Kültürü derslerine hoş geldiniz">
    <button class="opening-start" id="openingStart" type="button" aria-label="Başlat"></button>
  </main>
  <main class="app" id="app">
    <button class="back-button" id="backButton" type="button">← GERİ</button>
    <section class="view" id="colorView">
      <div class="color-head">
        <h1 class="title" id="colorTitle">BAYRAĞIMIZI BOYAYALIM</h1>
        <div class="reference-card" aria-label="Bayrak"><img id="referenceFlag" alt=""></div>
      </div>
      <div class="color-layout">
        <div class="flag-stage" id="paintStage"></div>
        <div class="paint-controls">
          <p class="feedback" id="feedback" aria-live="polite"></p>
          <div class="palette" id="palette" aria-label="Renk paleti"></div>
          <button class="next" id="colorNext" type="button">İLERİ</button>
        </div>
      </div>
    </section>
    <section class="view country-view" id="countryView">
      <h1 class="title">HANGİ ÜLKEDE YAŞIYORSUN?</h1>
      <div class="country-grid" id="countryGrid"></div>
    </section>
    <section class="view" id="finalView">
      <h1 class="title">BAYRAĞIM VE YAŞADIĞIM ÜLKE</h1>
      <div class="final-flags">
        <article class="final-flag"><div id="finalTurkey"></div><h2>TÜRKİYE</h2></article>
        <article class="final-flag"><div id="finalCountry"></div><h2 id="finalCountryName"></h2></article>
      </div>
      <div class="final-actions"><button class="next" id="againButton" type="button">TEKRAR OYNA</button><button class="next" id="videoNext" type="button">SONRAKİ</button></div>
    </section>
    <section class="view" id="videoView">
      <div class="flower-layer" id="flowerLayer" aria-hidden="true"></div>
      <div class="video-card">
        <video id="endingVideo" src="bitis-sarkisi.mp4" controls playsinline preload="metadata" aria-label="Oyun sonu videosu"></video>
        <button class="next" id="videoFinish" type="button">SONRAKİ</button>
      </div>
    </section>
    <section class="view" id="completionView">
      <div class="completion-card">
        <div class="completion-icon" aria-hidden="true">🏆</div>
        <h1>TEBRİKLER!</h1>
        <p>ETKİNLİĞİ TAMAMLADIN</p>
        <button class="next" id="restartGame" type="button">BAŞTAN BAŞLA</button>
      </div>
    </section>
    <details class="teacher">
      <summary>⚙ Öğretmen</summary>
      <div class="tools">
        <label>Oyun modu<select id="mode"><option value="guided">Doğru Renkleri Bul</option><option value="free">Serbest Boyama</option></select></label>
        <button class="tool" id="reset" type="button">↻ Baştan Başla</button>
        <div class="tool-row"><button class="tool" id="sound" type="button">🔊 Ses Açık</button><button class="tool" id="full" type="button">⛶ Tam Ekran</button></div>
      </div>
    </details>
  </main>
  <div class="confetti-layer" id="confetti"></div>
  <script>
  'use strict';
  const C={red:'#e30a17',white:'#ffffff',blue:'#2468b4',navy:'#0b3c80',yellow:'#f5c400',green:'#159447',orange:'#f28c28',black:'#111111',gray:'#b8c0c8',light:'#e3e7eb'};
  const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
  const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  function star(cx,cy,r,n=5,rot=-90){const a=[],ir=r*.382;for(let i=0;i<n*2;i++){const rr=i%2?ir:r,t=(rot+i*180/n)*Math.PI/180;a.push((cx+Math.cos(t)*rr).toFixed(1)+','+(cy+Math.sin(t)*rr).toFixed(1))}return a.join(' ')}
  function circlePath(cx,cy,r){return `M ${cx-r} ${cy} A ${r} ${r} 0 1 0 ${cx+r} ${cy} A ${r} ${r} 0 1 0 ${cx-r} ${cy} Z`}
  function reg(key,name,color,shapes,interactive,shade='#c1c8cf'){const fill=interactive?shade:color;return `<g class="${interactive?'paint-region':''}" ${interactive?`data-region="${key}" data-name="${esc(name)}" data-correct="${color}" role="button" tabindex="0"`:''}>${shapes(fill)}</g>`}
  const rect=(x,y,w,h,f,extra='')=>`<rect data-paint x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}" ${extra}/>`;
  const poly=(pts,f,extra='')=>`<polygon data-paint points="${pts}" fill="${f}" ${extra}/>`;
  const path=(d,f,extra='')=>`<path data-paint d="${d}" fill="${f}" ${extra}/>`;
  function svgWrap(w,h,body,label){return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label)}" xmlns="http://www.w3.org/2000/svg">${body}<rect x="1.5" y="1.5" width="${w-3}" height="${h-3}" fill="none" stroke="#607887" stroke-width="3" pointer-events="none"/></svg>`}
  function turkey(interactive=false){
    const G=600,W=900,outerX=300,innerX=337.5,cy=300,starX=537.5;
    console.assert(W===1.5*G&&20===G/30&&outerX===G/2&&innerX-outerX===G/16&&300===G/2&&240===.4*G&&starX-innerX===G/3&&150===G/4,'Türk bayrağı ölçü doğrulaması başarısız.');
    if(interactive){
      const base=`<image id="turkeyPaintImage" href="turk_bayragi_2893.png" x="0" y="0" width="900" height="600" preserveAspectRatio="none" style="filter:grayscale(1) contrast(1.08);opacity:.78" pointer-events="none"/>`;
      const ground=`<g class="paint-region" data-region="zemin" data-name="Bayrak" data-correct="${C.red}" role="button" tabindex="0"><rect data-paint x="0" y="0" width="900" height="600" fill="transparent" pointer-events="all"/></g>`;
      const moon=`${circlePath(300,300,150)} ${circlePath(337.5,300,120)}`;
      const moonLayer=`<g class="paint-region" data-region="ay" data-name="Ay" data-correct="${C.white}" role="button" tabindex="0"><path data-paint d="${moon}" fill="transparent" fill-rule="evenodd"/><circle data-hit cx="300" cy="300" r="170" fill="transparent" pointer-events="all"/></g>`;
      const starLayer=`<g class="paint-region" data-region="yildiz" data-name="Yıldız" data-correct="${C.white}" role="button" tabindex="0"><polygon data-paint points="${star(532,300,70,5,180)}" fill="transparent"/><circle data-hit cx="532" cy="300" r="92" fill="transparent" pointer-events="all"/></g>`;
      return svgWrap(900,600,base+ground+moonLayer+starLayer,'Boyanabilir Türkiye bayrağı');
    }

  const countries=[

  const getCountry=id=>countries.find(c=>c.id===id);
  function staticFlag(c){const file=c.id==='turkey'?'turk_bayragi_2893.png':c.name+'.png';return `<img src="${esc(file)}" alt="${esc(c.name)} bayrağı" draggable="false">`}
  const audioMap={opening:['acilis.mp3'],findTurkey:['sesler/turk-bayragini-bul.mp3','türk bayrağını bul.wav'],success:['sesler/harika.mp3','harika.wav'],turkey:['sesler/turkiye.mp3','Türkiye.wav'],chooseCountry:['sesler/hangi-ulkede-yasiyorsun.mp3','hangi ülkede.wav']};
  let activeAudio=null,soundOn=true,audioToken=0;
  function stopAudio(){audioToken++;if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;activeAudio=null}if('speechSynthesis'in window)speechSynthesis.cancel()}
  /* Bilgisayarın yapay konuşma sesi kullanılmaz. Yalnızca klasördeki kayıtlar çalınır. */
  function speak(text,done){done&&done()}
  function playFiles(files,text,done){stopAudio();const token=audioToken;let i=0;function tryNext(){if(token!==audioToken)return;if(i>=files.length){speak(text,done);return}const a=new Audio(files[i++]);activeAudio=a;a.onended=()=>{if(token===audioToken){activeAudio=null;done&&done()}};a.onerror=tryNext;const p=a.play();if(p)p.catch(tryNext)}if(!soundOn){done&&done();return}tryNext()}
  function playKey(key,text,done){playFiles(audioMap[key]||[],text,done)}function playCountry(c,done){playFiles([`sesler/${c.id}.mp3`,c.audio],c.name,done)}
  const views=$$('.view');function showView(id){views.forEach(v=>v.classList.toggle('active',v.id===id))}
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
  function confetti(){const layer=$('#confetti'),colors=[C.red,C.yellow,C.blue,C.green,C.white];layer.innerHTML='';for(let i=0;i<58;i++){const p=document.createElement('i');p.className='confetti';p.style.left=(2+Math.random()*96)+'%';p.style.background=colors[i%colors.length];p.style.animationDelay=(Math.random()*.3)+'s';p.style.setProperty('--x',(-120+Math.random()*240)+'px');p.style.setProperty('--r',(360+Math.random()*700)+'deg');layer.appendChild(p)}setTimeout(()=>layer.innerHTML='',2300)}
  let currentCountry=null,currentFlag='turkey',selected=C.red,finished=false;
  const palette=[['#e30a17','Kırmızı'],['#ffffff','Beyaz'],['#2468b4','Mavi'],['#f5c400','Sarı'],['#159447','Yeşil'],['#f28c28','Turuncu'],['#111111','Siyah']];
  $('#palette').innerHTML=palette.map((x,i)=>`<button class="swatch" style="--c:${x[0]}" data-color="${x[0]}" data-name="${x[1]}" aria-label="${x[1]} boya tüpü" aria-pressed="${i===0}"><span class="tube-check" aria-hidden="true">✓</span></button>`).join('');
  $('#palette').addEventListener('click',e=>{const b=e.target.closest('.swatch');if(!b)return;selected=b.dataset.color.toLowerCase();$$('.swatch').forEach(x=>x.setAttribute('aria-pressed',x===b));speak(b.dataset.name)});
  function regionShapes(group){const painted=[...group.querySelectorAll('[data-paint]')];return painted.length?painted:[...group.querySelectorAll('rect:not([data-hit]),circle:not([data-hit]),ellipse:not([data-hit]),polygon:not([data-hit]),path:not([data-hit])')]}
  function preparePaintRegions(){const groups=$$('#paintStage [data-region]');groups.forEach(group=>regionShapes(group).forEach(shape=>{shape.setAttribute('fill','transparent');shape.style.opacity='0';shape.style.pointerEvents='all'}))}
  const colorKey=color=>color.replace('#','').toLowerCase();
  function prepareCountryImage(c){const svg=$('#paintStage svg');if(!svg)return;const ns='http://www.w3.org/2000/svg';let image=svg.querySelector('#countryPaintImage');if(!image){image=document.createElementNS(ns,'image');image.id='countryPaintImage';image.setAttribute('x','0');image.setAttribute('y','0');image.setAttribute('width',svg.viewBox.baseVal.width);image.setAttribute('height',svg.viewBox.baseVal.height);image.setAttribute('preserveAspectRatio','xMidYMid meet');svg.insertBefore(image,svg.firstChild)}image.setAttribute('href','paint-cutouts-v2/'+c.id+'.png');image.style.filter='grayscale(1) contrast(1.08)';image.style.opacity='1';image.style.pointerEvents='none';[...svg.children].forEach(child=>{if(child!==image&&!child.classList.contains('paint-region')&&child.tagName.toLowerCase()!=='defs')child.style.display='none'});const firstRegion=svg.querySelector('.paint-region'),colors=[...new Set([...svg.querySelectorAll('.paint-region')].map(group=>group.dataset.correct.toLowerCase()))];colors.forEach(color=>{const layer=image.cloneNode(false);layer.removeAttribute('id');layer.classList.add('paint-image-layer','pixel-color-layer');layer.dataset.color=color;layer.setAttribute('href','paint-masks-v3/'+c.id+'-'+colorKey(color)+'.png');layer.style.filter='saturate(1.15) contrast(1.04)';layer.style.opacity='0';layer.style.pointerEvents='none';svg.insertBefore(layer,firstRegion)})}
  function beginColoring(id){currentFlag=id;finished=false;const next=$('#colorNext');next.hidden=false;next.disabled=false;next.textContent='İLERİ';$('#feedback').textContent='';const c=id==='turkey'?null:getCountry(id),ref=$('#referenceFlag');$('#colorTitle').textContent=id==='turkey'?'TÜRK BAYRAĞINI BOYAYALIM':c.name.toLocaleUpperCase('tr-TR')+' BAYRAĞINI BOYAYALIM';ref.src=id==='turkey'?'turk_bayragi_2893.png':c.name+'.png';ref.alt=(id==='turkey'?'Türkiye':c.name)+' bayrağı örneği';$('#paintStage').innerHTML=id==='turkey'?turkey(true):c.draw(true);if(c)prepareCountryImage(c);preparePaintRegions();showView('colorView');selected=C.red;$$('.swatch').forEach(x=>x.setAttribute('aria-pressed',x.dataset.color.toLowerCase()===selected))}

  $('#full').addEventListener('click',async()=>{try{if(!document.fullscreenElement){const f=document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen;if(f)await f.call(document.documentElement)}else{const f=document.exitFullscreen||document.webkitExitFullscreen;if(f)await f.call(document)}}catch(_){}});
