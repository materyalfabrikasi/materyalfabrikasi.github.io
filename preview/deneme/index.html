<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İnteraktif Video Etkinliği</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #container {
            width: 80%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        #instruction-screen, #question-screen {
            display: block;
        }

        #video-screen {
            display: none;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 15px 32px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: #45a049;
        }

        #question-text {
            font-size: 22px;
            margin-bottom: 20px;
            color: #333;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 16px;
            resize: none;
        }

        iframe {
            border-radius: 10px;
        }
    </style>
</head>
<body>

<div id="container">
    <div id="instruction-screen">
        <h2>Hoş Geldin!</h2>
        <p id="instruction-text">Şarkıyı dikkatle dinleyiniz. Belirlenen duraklama noktalarında size sorulacak soruları cevaplayınız.</p>
        <button class="btn" onclick="startActivity()">Tamam, Başla!</button>
    </div>

    <div id="video-screen">
        <div id="player"></div>
    </div>

    <div id="question-screen" style="display: none;">
        <p id="question-text"></p>
        <textarea id="user-answer" placeholder="Cevabınızı buraya yazınız..."></textarea>
        <br>
        <button class="btn" onclick="resumeVideo()">Cevabı Gönder ve Devam Et</button>
    </div>
</div>

<script>
    // YouTube IFrame Player API yükleme
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var checkInterval;
    
    // Sorular ve Duraklama Noktaları (Saniye cinsinden)
    const questions = [
        { time: 52, text: "Sizce bu şarkıda ne olmuş olabilir? Neden “eyvah” deniyor?" },
        { time: 86, text: "Şarkıda da belirtildiği üzere temiz olmak için neler yapmalıyız?" }, // 01:26 = 86 saniye
        { time: 206, text: "Peki, senin temizlik alışkanlıkların neler?" } // 03:26 = 206 saniye
    ];
    
    let currentQuestionIndex = 0;

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
            height: '450',
            width: '100%',
            videoId: 'ZKHAQZFwsfE',
            events: {
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function startActivity() {
        document.getElementById('instruction-screen').style.display = 'none';
        document.getElementById('video-screen').style.display = 'block';
        player.playVideo();
        startTracking();
    }

    function startTracking() {
        checkInterval = setInterval(() => {
            if (player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                let currentTime = Math.floor(player.getCurrentTime());
                
                if (currentQuestionIndex < questions.length && currentTime >= questions[currentQuestionIndex].time) {
                    pauseForQuestion();
                }
            }
        }, 1000);
    }

    function pauseForQuestion() {
        player.pauseVideo();
        clearInterval(checkInterval);
        
        document.getElementById('video-screen').style.display = 'none';
        document.getElementById('question-screen').style.display = 'block';
        document.getElementById('question-text').innerText = questions[currentQuestionIndex].text;
        document.getElementById('user-answer').value = ""; // Temizle
    }

    function resumeVideo() {
        document.getElementById('question-screen').style.display = 'none';
        document.getElementById('video-screen').style.display = 'block';
        
        currentQuestionIndex++;
        player.playVideo();
        startTracking();
    }

    function onPlayerStateChange(event) {
        // Video bittiğinde yapılacaklar buraya eklenebilir
    }
</script>

</body>
</html>
