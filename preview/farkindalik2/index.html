<style>
#lesson .card{display:grid;grid-template-columns:minmax(85px,130px) minmax(0,1fr);gap:12px 18px;width:min(670px,90vw)!important;padding:15px!important}
.stop-image{grid-row:1 / 3;width:100%;height:clamp(130px,23vh,190px);object-fit:contain;border-radius:15px;background:#fff3d6;align-self:center}
#lesson .word{align-self:end;font-size:clamp(30px,5vw,58px)}
#lesson .buttons{align-self:start;gap:10px}
.closing-art{object-fit:contain!important}
/* The train advances continuously from left to right, without resetting between stops. */
#train{transition:left 2.25s ease-in-out!important}
#train.lap-reset{left:-75%!important;transition:none!important;visibility:hidden}
@media(max-width:600px){#lesson .card{grid-template-columns:85px minmax(0,1fr);gap:8px!important}#lesson .btn.listen{font-size:16px;padding:8px}#lesson .go{width:68px!important;min-width:68px!important;height:58px!important;font-size:28px!important}}
</style>
<style>.train-child.merhaba-photo{object-fit:contain;background:#fff3d6;animation:none}</style>
<style>
/* A single, clear forward control; no reading required. */
#next.btn.go{width:190px!important;min-width:170px!important;height:80px!important;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:24px!important;overflow:visible!important;background:#ffd84d!important;animation:none!important;box-shadow:0 7px 0 #dba323,0 0 0 5px #fff5!important}

#next:disabled:after{display:none}

#next .move-train{font-size:37px}#next .move-target{font-size:32px}

@keyframes forwardCue{0%,100%{transform:translateX(-3px)}50%{transform:translateX(5px)}}

@keyframes soundFocus{
  0%,100%{transform:rotate(0) scale(1);filter:none;box-shadow:0 0 0 0 #ffd84d00}

  64%{transform:rotate(3deg) scale(1.05);filter:saturate(1.2);box-shadow:0 0 0 10px #75d9ef55}
  82%{transform:rotate(-1deg) scale(1.02);filter:saturate(1.1)}
}
@media(prefers-reduced-motion:reduce){.stop-image.sound-focus{animation:soundFocusReduced .7s ease}@keyframes soundFocusReduced{50%{filter:saturate(1.35);box-shadow:0 0 0 10px #ffd84d88,0 0 30px #ff8cab66}}}

<body>
<main class="app">
 <div class="world"><img class="school-bg" src="turk_okulu.png" alt="Türk bayraklı okul"><div class="garden-glow"></div><div class="forest-hills"></div><div class="forest-line"><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span></div><div class="forest-bushes"></div><div class="flowers"><span>🌷</span><span>🌼</span><span>🌻</span><span>🌺</span><span>🌼</span><span>🌷</span></div><div class="sun">🌞</div><div class="cloud c1">☁️</div><div class="cloud c2">☁️</div><div class="trees"><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span></div><div class="track"></div><div class="station" aria-label="Türk bayraklı okul"><div class="yard"></div><div class="school-roof"></div><div class="school-body"></div><div class="school-sign">OKUL</div><div class="school-door"></div><div class="school-window left"></div><div class="school-window right"></div><div class="flagpole"></div><div class="turkish-flag">☾★</div></div></div>
 <div class="progress" aria-label="İlerleme"><i class="dot on"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div>
 <button class="global-reset" id="globalReset">🔄 Yeniden Oyna</button><div class="effects"></div>
 <section class="screen active intro" id="intro"><img class="intro-image" src="acilis-gokkusaksiz.png" alt="Çevrim içi Türkçe etkinliğine katılan çocuk"><h1 class="welcome-title">Çevrim İçi Türkçe ve Türk Kültürü Dersine Hoş Geldiniz!</h1><button class="start-game" id="startGame">▶ Başla</button></section>
 <section class="screen" id="lesson"><div class="route-stops"><div class="route-line"></div><div class="route-stop active" data-stop="0"><span class="route-icon">👋</span><span class="route-label">1. DURAK</span></div><div class="route-stop" data-stop="1"><span class="route-icon">🌞</span><span class="route-label">2. DURAK</span></div><div class="route-stop" data-stop="2"><span class="route-icon">🏠</span><span class="route-label">3. DURAK</span></div></div>
  <div class="train" id="train" aria-hidden="true"><img class="train-art" src="tcdd_treni.png" alt="TCDD Sevimli Ekspres"><img class="train-child" src="el_sallayan_cocuk.png" alt="El sallayan kız öğrenci"></div><div class="card"><img id="stopImage" class="stop-image" src="merhaba-resim.jpg" alt="Merhaba"><h1 class="word" id="word">Merhaba</h1><div class="buttons"><button class="btn listen" id="listen">🔊 Tekrar Dinle</button><button class="btn go" id="next" aria-label="İlerle">🚂➜</button></div></div>
 </section>
 <section class="screen" id="videoScreen"><div class="video-card"><video id="video" controls playsinline preload="metadata"></video><div class="video-note">🎬 İzle</div><button class="video-next" id="videoNext">➡️ Devam Et</button></div></section>
 <section class="screen" id="closing"><div class="finish-card"><img class="closing-art" src="hoscakalin.png" alt="El sallayarak vedalaşan kız öğrenci"><h2 class="finish-title">Harika! Etkinliği tamamladın! ⭐</h2><div class="buttons"><button class="btn listen" id="byeAgain">🔊 Hoşça kalı dinle</button><button class="btn restart" id="restart">🔄 Baştan Oyna</button><button class="btn end" id="end">✅ Bitir</button></div></div></section>
 <section class="screen" id="final"><div class="finish-card"><div class="final-star">🌟</div><div class="final-text">Harikasın!</div></div></section>
</main>
<script>
/* DOSYA ADLARI: Gerektiğinde yalnızca bu bölümü değiştirin. */
const FILES={
  acilis:"açılış.mp3",
  merhaba:"merhaba.mp3",
  gunaydin:"günaydın.mp3", // Sorun olursa: "gunaydin.mp3"
  hoscakal:"hoşça kal.mp3", // Sorun olursa: "hoscakal.mp3"
  video:"video.mp4"         // Örnek: "videoplayback.mp4"
};
const STOPS=[
 {word:"Merhaba",audio:FILES.merhaba,image:"merhaba-resim.jpg"},
 {word:"Günaydın",audio:FILES.gunaydin,image:"gunaydin-resim.png"},
 {word:"Hoşça kal",audio:FILES.hoscakal,image:"hoscakalin.png"}
];
const train=document.querySelector("#train"),word=document.querySelector("#word"),next=document.querySelector("#next"),listen=document.querySelector("#listen"),video=document.querySelector("#video"),videoNext=document.querySelector("#videoNext");
const screens=[...document.querySelectorAll(".screen")],dots=[...document.querySelectorAll(".dot")];
let stop=0,busy=true,currentAudio=null,playToken=0;
video.src=FILES.video;speechSynthesis.onvoiceschanged=()=>femaleTurkishVoice();
let audioContext=null;
function getAudioContext(){
  if(!audioContext) audioContext=new (window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==="suspended") audioContext.resume().catch(()=>{});
  return audioContext;
}
function chuffPuff(delay=0){
  try{
    const ctx=getAudioContext(),start=ctx.currentTime+delay,length=Math.floor(ctx.sampleRate*.18),buffer=ctx.createBuffer(1,length,ctx.sampleRate),data=buffer.getChannelData(0);
    for(let i=0;i<length;i++) data[i]=(Math.random()*2-1)*Math.pow(1-i/length,2);
    const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
    source.buffer=buffer;filter.type="lowpass";filter.frequency.value=520;gain.gain.setValueAtTime(.001,start);gain.gain.exponentialRampToValueAtTime(.3,start+.025);gain.gain.exponentialRampToValueAtTime(.001,start+.18);
    source.connect(filter).connect(gain).connect(ctx.destination);source.start(start);
  }catch(e){}
}
function paintNext(){next.innerHTML='<span class="move-train" aria-hidden="true">🚂</span><span class="move-arrow" aria-hidden="true">➜</span>'+(stop===2?'<span class="move-target" aria-hidden="true">🎬</span>':'');next.setAttribute('aria-label',stop===2?'Trenle videoya ilerle':'Treni sonraki durağa götür');}
paintNext();next.disabled=true;
function chuffTrain(count=7){for(let i=0;i<count;i++)chuffPuff(i*.32)}function show(id,progress){screens.forEach(x=>x.classList.toggle("active",x.id===id));dots.forEach((x,i)=>x.classList.toggle("on",i===progress));if(id==='lesson')paintNext()}
function stopSound(){playToken++;if(currentAudio){currentAudio.pause();currentAudio.currentTime=0;currentAudio=null}speechSynthesis.cancel()}
function femaleTurkishVoice(){
 const voices=speechSynthesis.getVoices();
 const turkish=voices.filter(v=>(v.lang||"").toLowerCase().startsWith("tr"));
 const femaleNames=/emel|seda|filiz|female|kadın|woman/i;
 const anyFemale=voices.find(v=>femaleNames.test(v.name)||/zira/i.test(v.name)); return turkish.find(v=>femaleNames.test(v.name))||anyFemale||turkish[0]||null;
}
function fallbackSpeak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="tr-TR";u.rate=.72;u.pitch=1.2;const voice=femaleTurkishVoice();if(voice)u.voice=voice;speechSynthesis.speak(u)}
function focusStopImage(){const image=document.querySelector("#stopImage");image.classList.remove("sound-focus");void image.offsetWidth;image.classList.add("sound-focus");setTimeout(()=>image.classList.remove("sound-focus"),1200)}
function playGreeting(){stopSound();const token=playToken;const data=STOPS[stop];const audio=new Audio(data.audio);currentAudio=audio;let failed=false;audio.addEventListener("playing",focusStopImage,{once:true});const fallback=()=>{if(failed||token!==playToken)return;failed=true;currentAudio=null;focusStopImage();fallbackSpeak(data.word)};audio.onerror=fallback;audio.play().catch(fallback)}
function sparkle(){const box=document.querySelector(".effects");for(let i=0;i<18;i++){const s=document.createElement("span");s.className="spark";s.textContent=i%3?"⭐":"✨";s.style.left="50%";s.style.top="45%";s.style.setProperty("--x",(Math.random()*700-350)+"px");s.style.setProperty("--y",(Math.random()*500-250)+"px");box.append(s);setTimeout(()=>s.remove(),1250)}}
function arrive(autoSound=true){busy=true;next.disabled=true;listen.disabled=true;document.querySelector('#stopImage').src=STOPS[stop].image;document.querySelector('#stopImage').alt=STOPS[stop].word;const trainPhoto=document.querySelector('.train-child');trainPhoto.src='el_sallayan_cocuk.png';trainPhoto.alt='El sallayan kız öğrenci';trainPhoto.classList.remove('merhaba-photo');chuffTrain(7);train.classList.remove("depart","stop-0","stop-1","stop-2");train.classList.add("stop-"+stop,"arrived");setTimeout(()=>{busy=false;next.disabled=false;listen.disabled=false;if(autoSound)playGreeting()},2300)}
function updateStop(){document.querySelectorAll(".route-stop").forEach((x,i)=>x.classList.toggle("active",i===stop));word.textContent=STOPS[stop].word;next.textContent=stop===2?"🎬➜":"🚂➜";show("lesson",stop);arrive(true)}
listen.addEventListener("click",()=>{if(!busy)playGreeting()});
next.addEventListener("click",()=>{
  if(busy)return;
  busy=true;next.disabled=true;listen.disabled=true;
  next.classList.add("launch");
  setTimeout(()=>next.classList.remove("launch"),350);
  stopSound();chuffTrain(8);
  // First travel completely off the right edge, always facing forward.
  train.classList.remove("arrived");train.classList.add("depart");
  setTimeout(()=>{
    if(stop<2){
      // Reposition only while invisible, so no reverse movement is shown.
      train.classList.add("lap-reset");
      train.classList.remove("depart","stop-0","stop-1","stop-2");
      void train.offsetWidth;
      setTimeout(()=>{
        stop++;
        train.classList.remove("lap-reset");
        updateStop();
      },180);
    }else{
      videoNext.classList.remove("show");show("videoScreen",3);
      video.currentTime=0;video.play().catch(()=>{});
    }
  },2350);
});
video.addEventListener("ended",()=>{videoNext.classList.add("show");sparkle()});
videoNext.addEventListener("click",()=>{show("closing",4);sparkle();setTimeout(()=>playClosing(),350)});
function playClosing(){stopSound();const token=playToken;const a=new Audio(FILES.hoscakal);currentAudio=a;let failed=false;const fallback=()=>{if(failed||token!==playToken)return;failed=true;fallbackSpeak("Hoşça kal")};a.onerror=fallback;a.play().catch(fallback)}
document.querySelector("#byeAgain").addEventListener("click",playClosing);
document.querySelector("#restart").addEventListener("click",()=>{stopSound();video.pause();videoNext.classList.remove("show");stop=0;busy=true;word.textContent=STOPS[0].word;document.querySelectorAll(".route-stop").forEach((x,i)=>x.classList.toggle("active",i===0));next.textContent="🚂➜";train.className="train";train.style.transition="none";train.style.left="-58%";void train.offsetWidth;train.style.transition="";show("lesson",0);setTimeout(()=>arrive(true),250)});
document.querySelector("#end").addEventListener("click",()=>{stopSound();show("final",4);sparkle()});
document.addEventListener("pointerdown",()=>getAudioContext(),{once:true});
document.querySelector("#globalReset").addEventListener("click",()=>{stopSound();video.pause();location.reload()});
const startGame=document.querySelector("#startGame");
startGame.addEventListener("click",()=>{
  if(startGame.disabled)return;
  startGame.disabled=true;
  getAudioContext();
  stopSound();
  let opened=false;
  const begin=()=>{if(opened)return;opened=true;show("lesson",0);setTimeout(()=>arrive(true),250)};
  const welcome=new Audio(FILES.acilis);
  currentAudio=welcome;
  welcome.onended=begin;
  welcome.onerror=()=>{fallbackSpeak("Çevrim içi Türkçe ve Türk Kültürü dersine hoş geldiniz!");setTimeout(begin,4200)};
  welcome.play().catch(()=>{fallbackSpeak("Çevrim içi Türkçe ve Türk Kültürü dersine hoş geldiniz!");setTimeout(begin,4200)});
  setTimeout(begin,6500);
});
</script>
</body></html>
