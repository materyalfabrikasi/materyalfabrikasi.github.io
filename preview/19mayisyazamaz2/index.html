
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>19 Mayıs Yapboz Etkinliği</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            overflow: hidden; /* Sayfa kaymasını engeller */
            background-color: #f8fafc;
        }
        .puzzle-piece {
            transition: transform 0.1s, filter 0.2s;
            cursor: pointer;
            border: none; 
            outline: none;
        }
        .puzzle-piece:hover {
            filter: brightness(1.05);
            z-index: 5;
        }
        .selected {
            outline: 6px solid #ef4444; 
            outline-offset: -6px;
            z-index: 10;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.6);
        }
        .correct-animation {
            animation: celebrate 0.8s ease-in-out;
        }
        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }
        #puzzle-container {
            /* Yapboz karesini ve parçaları büyütmek için değerler artırıldı */
            width: 82vh; 
            height: 82vh;
            max-width: 92vw;
            max-height: 92vw;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 0; 
        }
        .audio-instruction-btn {
            background-color: #fee2e2;
            border: 2px solid #ef4444;
            color: #b91c1c;
            padding: 0.5rem 1.5rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: bold;
            transition: all 0.2s;
        }
        .audio-instruction-btn:hover {
            background-color: #fecaca;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2">

    <div class="flex flex-col items-center justify-center w-full max-w-7xl h-screen">
        
        <!-- Üst Bölüm: Başlık ve Sesli Yönerge -->
        <div class="text-center mb-4 w-full flex flex-col items-center">
            <h1 class="text-xl lg:text-3xl font-black text-red-600 mb-4 uppercase tracking-tight">
                19 Mayıs Atatürk'ü Anma, Gençlik ve Spor Bayramı
            </h1>
            
            <!-- Yazılı yönerge yerine sesli yönerge butonu -->
            <button onclick="playInstruction()" class="audio-instruction-btn shadow-sm">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                Yönergeyi Dinle
            </button>
        </div>

        <!-- Orta Bölüm: Yapboz (Büyütülmüş) -->
        <div id="puzzle-container" class="bg-slate-200 shadow-2xl rounded-lg overflow-hidden border-4 border-slate-300">
            <!-- Parçalar JS ile eklenecek -->
        </div>

        <!-- Alt Bölüm: Kontrol -->
        <div class="mt-4 flex flex-col items-center gap-2">
            <p id="status-text" class="text-md font-bold text-slate-400 uppercase tracking-widest">Parçaları Eşleştirin</p>
            
            <button id="reset-btn" class="bg-red-600 hover:bg-red-700 text-white text-md px-8 py-2 rounded-full font-black shadow-lg transition-all active:scale-95">
                YENİDEN BAŞLAT
            </button>
        </div>
    </div>

    <!-- Ses Dosyaları -->
    <audio id="instruction-sound" src="2.mp3" preload="auto"></audio>
    <audio id="piece-correct-sound" src="1.mp3" preload="auto"></audio>
    <audio id="win-sound" src="a.mp3" preload="auto"></audio>

    <script>
        const container = document.getElementById('puzzle-container');
        const instructionSound = document.getElementById('instruction-sound');
        const pieceCorrectSound = document.getElementById('piece-correct-sound');
        const winSound = document.getElementById('win-sound');
        const resetBtn = document.getElementById('reset-btn');
        const statusText = document.getElementById('status-text');
        
        const ROWS = 3;
        const COLS = 3;
        let pieces = [];
        let selectedIndex = null;

        function playInstruction() {
            instructionSound.currentTime = 0;
            instructionSound.play().catch(e => console.error("2.mp3 dosyası çalınamadı."));
        }

        function initPuzzle() {
            pieces = [];
            selectedIndex = null;
            container.innerHTML = '';
            statusText.innerText = "Parçaları Eşleştirin";
            statusText.className = "text-md font-bold text-slate-400 uppercase tracking-widest";
            container.classList.remove('correct-animation');
            
            for (let i = 0; i < ROWS * COLS; i++) {
                pieces.push(i);
            }

            shuffle(pieces);
            render();
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            if (isSolved()) shuffle(array);
        }

        function render() {
            container.innerHTML = '';
            pieces.forEach((pieceId, index) => {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece w-full h-full bg-cover bg-no-repeat';
                
                if (selectedIndex === index) {
                    piece.classList.add('selected');
                }

                const row = Math.floor(pieceId / COLS);
                const col = pieceId % COLS;
                
                const posX = (col / (COLS - 1)) * 100;
                const posY = (row / (ROWS - 1)) * 100;

                piece.style.backgroundImage = "url('1.png')";
                piece.style.backgroundSize = "300% 300%";
                piece.style.backgroundPosition = `${posX}% ${posY}%`;
                piece.style.imageRendering = "auto";

                piece.onclick = () => handlePieceClick(index);
                container.appendChild(piece);
            });
        }

        function handlePieceClick(index) {
            if (isSolved()) return;

            if (selectedIndex === null) {
                selectedIndex = index;
                statusText.innerText = "İkinci parçayı seçin";
                render();
            } else {
                if (selectedIndex !== index) {
                    // Yer değiştirme işlemi
                    const oldPiece1 = pieces[selectedIndex];
                    const oldPiece2 = pieces[index];

                    [pieces[selectedIndex], pieces[index]] = [pieces[index], pieces[selectedIndex]];
                    
                    const newPos1 = selectedIndex;
                    const newPos2 = index;

                    // Hamle sonucu parçalardan herhangi biri doğru yerine oturdu mu kontrol et
                    if ((pieces[newPos1] === newPos1) || (pieces[newPos2] === newPos2)) {
                        if (!isSolved()) {
                            pieceCorrectSound.currentTime = 0;
                            pieceCorrectSound.play().catch(e => {});
                        }
                    }

                    selectedIndex = null;
                    statusText.innerText = "Harika, devam et!";
                    render();
                    checkWin();
                } else {
                    selectedIndex = null;
                    statusText.innerText = "Seçim kaldırıldı";
                    render();
                }
            }
        }

        function isSolved() {
            return pieces.every((id, index) => id === index);
        }

        function checkWin() {
            if (isSolved()) {
                statusText.innerText = "Tamamlandı!";
                statusText.className = "text-md font-bold text-green-600 uppercase tracking-widest";
                container.classList.add('correct-animation');
                
                // Yapboz bittiğinde a.mp3 çalıyor
                winSound.currentTime = 0;
                winSound.play().catch(e => console.error("a.mp3 dosyası çalınamadı."));
            }
        }

        resetBtn.onclick = initPuzzle;
        window.onload = initPuzzle;
    </script>
</body>
</html>
