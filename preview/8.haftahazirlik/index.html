<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tıkla, Dinle | 8. Hafta</title><link rel="stylesheet" href="clean.css?v=43"><script defer src="flow.js?v=50"></script>
<style>:root{--ink:#10233e;--blue:#1e4f86;--cyan:#38b7c9;--gold:#ffbf47;--cream:#fff8ea;--white:#fff;--soft:#eaf4f7}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:linear-gradient(145deg,#f9fbff 0%,#e7f6f5 50%,#fff3d9 100%)}body:before,body:after{content:"";position:fixed;border-radius:50%;filter:blur(4px);opacity:.55;pointer-events:none}body:before{width:38vw;height:38vw;left:-17vw;top:-20vw;background:#9de1e9}body:after{width:32vw;height:32vw;right:-13vw;bottom:-20vw;background:#ffd27b}.app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:clamp(12px,2vh,24px) clamp(16px,3vw,44px);position:relative}.topbar{display:flex;justify-content:space-between;align-items:center;z-index:5}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:44px;aspect-ratio:1;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--blue),#15375e);color:#fff;font-size:22px;box-shadow:0 8px 20px #1e4f8630}.brandcopy b{display:block;font-size:clamp(17px,2.5vh,27px);letter-spacing:-.02em}.brandcopy small{color:#60758b;font-weight:600}.progress{display:flex;align-items:center;gap:10px;padding:9px 14px;border:1px solid #ffffffd9;border-radius:99px;background:#ffffffb8;box-shadow:0 8px 30px #274b6b14;backdrop-filter:blur(12px);font-weight:800;color:#52687c}.bar{width:clamp(70px,10vw,125px);height:7px;border-radius:9px;background:#dce7eb;overflow:hidden}.fill{width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue));transition:width .35s}.game{position:relative;min-height:0;width:min(94vw,1020px);height:100%;margin:auto}.ring{position:absolute;left:50%;top:50%;translate:-50% -50%;width:min(78vw,780px);height:min(65vh,650px);border-radius:50%;border:1px solid #fff;box-shadow:inset 0 0 0 12px #ffffff30,0 30px 80px #34617d18;background:radial-gradient(circle,#ffffff99 0 33%,#ffffff25 34% 68%,transparent 69%)}.ring:before{content:"";position:absolute;inset:4%;border-radius:50%;border:2px dashed #1e4f8625}.choice{position:absolute;width:clamp(78px,12vh,130px);aspect-ratio:1;border:0;border-radius:50%;padding:6px;background:#fff;box-shadow:0 12px 30px #1c426033;cursor:pointer;z-index:3;transition:translate .25s,scale .25s,box-shadow .25s}.choice:hover,.choice:focus-visible{scale:1.08;outline:4px solid #ffffff;box-shadow:0 0 0 6px var(--gold),0 16px 38px #1c42604d}.choice.active{scale:1.13;box-shadow:0 0 0 6px var(--gold),0 18px 42px #1c426052}.choice.next{animation:pulse 1.5s infinite}.choice video{width:100%;height:100%;object-fit:cover;border-radius:50%;pointer-events:none}.badge{position:absolute;left:-4px;top:-4px;width:31%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),#ff9f2d);color:#17304f;font-weight:900;font-size:clamp(13px,2vh,20px);border:3px solid #fff}.c1{left:calc(50% - 60px);top:2%}.c2{right:11%;top:21%}.c3{right:11%;bottom:14%}.c4{left:calc(50% - 60px);bottom:1%}.c5{left:11%;bottom:14%}.c6{left:11%;top:21%}.stage{position:absolute;left:50%;top:50%;translate:-50% -50%;width:clamp(185px,30vh,330px);aspect-ratio:9/16;border-radius:30px;padding:7px;background:linear-gradient(145deg,#fff,#d9edf1);box-shadow:0 24px 65px #133e5e4d;z-index:2;transition:scale .3s}.stage.playing{scale:1.035}.screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:24px;background:linear-gradient(160deg,#193d65,#10233e)}.screen video{width:100%;height:100%;object-fit:cover;display:block}.hint{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:20px;color:#fff}.hint-icon{width:64px;aspect-ratio:1;margin:0 auto 15px;border-radius:20px;display:grid;place-items:center;background:var(--gold);color:#163552;font-size:30px;box-shadow:0 12px 25px #0003}.hint b{font-size:clamp(18px,2.8vh,28px)}.hint span{margin-top:7px;color:#cfe0ee;font-size:clamp(12px,1.6vh,16px)}.label{position:absolute;left:7%;right:7%;bottom:5%;padding:11px 12px;border-radius:14px;background:#10233ee8;color:#fff;text-align:center;font-weight:900;font-size:clamp(14px,2.1vh,22px);border-bottom:4px solid var(--gold);pointer-events:none}.foot{text-align:center;z-index:5}.instruction{display:inline-flex;align-items:center;gap:9px;padding:8px 15px;border-radius:99px;background:#ffffffad;color:#587086;font-size:clamp(11px,1.5vh,14px);box-shadow:0 8px 25px #274b6b12}.instruction i{width:8px;height:8px;border-radius:50%;background:var(--cyan)}@keyframes pulse{50%{box-shadow:0 0 0 10px #ffbf4730,0 12px 30px #1c426033}}@media(max-aspect-ratio:4/5){.brandcopy small{display:none}.game{width:100%}.ring{width:96vw;height:68vh}.stage{width:clamp(145px,24vh,235px)}.choice{width:clamp(62px,9vh,92px)}.c1,.c4{left:calc(50% - 42px)}.c2,.c3{right:0}.c5,.c6{left:0}.progress{padding:7px 10px}.bar{display:none}}</style></head>
<body class="intro-active">
<section class="opening-screen" id="openingScreen" aria-label="Etkinlik açılışı">
  <div class="opening-frame">
    <img class="opening-picture" src="assets/images/acilis.png?v=2" alt="Ülkem Yanımda ile Türkçe ve Türk Kültürü derslerine hoş geldiniz">
    <button class="opening-start" id="openingStart" type="button" aria-label="Etkinliği başlat"><span>Başlat</span></button>
  </div>
  <audio id="openingAudio" src="assets/audio/acilis.mp3" preload="auto"></audio>
</section>
<main class="app"><header class="topbar"><div class="brand"><div class="brandmark">♪</div><div class="brandcopy"><b>Tıkla, Dinle</b><small>8. Hafta • Vücudumuz</small></div></div><div class="progress"><span id="count">0 / 6</span><div class="bar"><div class="fill" id="fill"></div></div></div></header>
<section class="game"><div class="ring"></div><button class="choice c1 next" data-src="basım burda.mp4" data-title="Başım Burada"><span class="badge">1</span><video muted preload="metadata" src="basım burda.mp4"></video></button><button class="choice c2" data-src="gözüm burda.mp4" data-title="Gözüm Burada"><span class="badge">2</span><video muted preload="metadata" src="gözüm burda.mp4"></video></button><button class="choice c3" data-src="kulağım burda.mp4" data-title="Kulağım Burada"><span class="badge">3</span><video muted preload="metadata" src="kulağım burda.mp4"></video></button><button class="choice c4" data-src="ellerin nerde.mp4" data-title="Ellerim Nerede?"><span class="badge">4</span><video muted preload="metadata" src="ellerin nerde.mp4"></video></button><button class="choice c5" data-src="ayağım burda.mp4" data-title="Ayağım Burada"><span class="badge">5</span><video muted preload="metadata" src="ayağım burda.mp4"></video></button><button class="choice c6" data-src="harika baş göz kulak el ve ayak.mp4" data-title="Harika!"><span class="badge">6</span><video muted preload="metadata" src="harika baş göz kulak el ve ayak.mp4"></video></button>
<div class="stage" id="stage"><div class="screen"><video id="player" controls playsinline></video><div class="hint" id="hint"><div class="hint-icon">▶</div><b>Hazırsan başlayalım!</b><span>1 numaralı videoya tıkla.</span></div><div class="label" id="label" hidden></div></div></div></section><footer class="foot"><span class="instruction"><i></i>Videoyu dinle, sonra sıradaki numaraya tıkla.</span></footer></main>
<script>const choices=[...document.querySelectorAll('.choice')],player=document.querySelector('#player'),stage=document.querySelector('#stage'),label=document.querySelector('#label'),hint=document.querySelector('#hint'),count=document.querySelector('#count'),fill=document.querySelector('#fill');let active=-1,completed=new Set;function select(i){active=i;choices.forEach((x,n)=>{x.classList.toggle('active',n===i);x.classList.remove('next')});const x=choices[i];player.src=x.dataset.src;label.textContent=x.dataset.title;hint.hidden=true;label.hidden=false;stage.classList.add('playing');player.play().catch(()=>{})}choices.forEach((x,i)=>x.addEventListener('click',()=>select(i)));player.addEventListener('play',()=>stage.classList.add('playing'));player.addEventListener('pause',()=>stage.classList.remove('playing'));player.addEventListener('ended',()=>{stage.classList.remove('playing');completed.add(active);count.textContent=`${completed.size} / 6`;fill.style.width=`${completed.size/6*100}%`;const next=(active+1)%choices.length;choices[next].classList.add('next');label.textContent=completed.size===6?'Harika! Hepsini tamamladın.':`${next+1}. videoya tıkla`})</script></body></html>
