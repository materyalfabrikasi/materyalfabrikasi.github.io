// Profesyonel, kavisli Leylo uçuş sistemi.
function addFlightShadow(el){if(el.tagName==='IMG')return{animate:()=>null};let s=el.querySelector('.flight-shadow');if(!s){s=document.createElement('i');s.className='flight-shadow';el.appendChild(s)}return s}
function curvedFlight(el,target,options={}){
  const from=el.getBoundingClientRect(),to=target.getBoundingClientRect();
  const dx=to.left+to.width*(options.targetX||.18)-(from.left+from.width/2),dy=to.top+to.height/2-(from.top+from.height/2),lift=Math.min(-75,dy-80),scale=options.scale||.72;
  const shadow=addFlightShadow(el);el.classList.remove('flap','no');el.classList.add('flying-pro');
  shadow.animate([{opacity:.32,transform:'translate(-50%,0) scale(1)'},{opacity:.1,transform:'translate(-50%,30px) scale(.5)'},{opacity:.2,transform:'translate(-50%,8px) scale(.72)'}],{duration:1120,easing:'cubic-bezier(.22,.75,.18,1)',fill:'forwards'});
  const anim=el.animate([
    {transform:'translate(0,0) scale(1) rotate(0deg)',offset:0},
    {transform:'translate(-5px,10px) scale(1.03,.96) rotate(-2deg)',offset:.1},
    {transform:`translate(${dx*.25}px,${lift}px) scale(.94) rotate(-7deg)`,offset:.35},
    {transform:`translate(${dx*.7}px,${dy-45}px) scale(${scale+.06}) rotate(4deg)`,offset:.72},
    {transform:`translate(${dx}px,${dy}px) scale(${scale}) rotate(0deg)`,offset:1}
  ],{duration:1120,easing:'cubic-bezier(.2,.72,.18,1)',fill:'forwards'});
  anim.onfinish=()=>{el.style.transform=`translate(${dx}px,${dy}px) scale(${scale})`;el.classList.remove('flying-pro')};return anim
}
fly=function(card){curvedFlight(L,card,{targetX:.14,scale:innerWidth<781?.58:.7})};
reset=function(){L.getAnimations().forEach(a=>a.cancel());L.className='leylo flap';L.style.cssText='--x:0px;--y:0px'};
chooseHome=function(index,card){
  if(homeBusy)return;homeBusy=true;chosenCountry=index;grid.querySelectorAll('button').forEach(b=>b.disabled=true);card.classList.add('chosen');countryVoice(countries[index][0]);
  curvedFlight(homeLeylo,card,{targetX:.5,scale:.46});
  setTimeout(()=>{preparePersonalRounds();home.classList.add('hide');homeBusy=false;homeLeylo.getAnimations().forEach(a=>a.cancel());homeLeylo.style.transform='';homeLeylo.classList.remove('flying-pro');grid.querySelectorAll('button').forEach(b=>{b.disabled=false;b.classList.remove('chosen')});r=0;draw()},1450)
};
