<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pırıl ile Neşeli Spor Macerası</title>

<style>

:root{
--ana-renk:#FF6B6B;
--yesil:#4CAF50;
--mavi:#2196F3;
--sari:#FFD93D;
}

body{
font-family:Comic Sans MS;
background:#FFF9E3;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

#game-container{
width:90%;
max-width:800px;
background:white;
padding:25px;
border-radius:40px;
border:6px solid var(--ana-renk);
text-align:center;
}

#player{
display:none;
border-radius:20px;
overflow:hidden;
}

#question-overlay{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:white;
width:80%;
padding:20px;
border-radius:20px;
border:5px solid var(--mavi);
}

.btn-play{
background:var(--yesil);
color:white;
border:none;
padding:20px 50px;
font-size:1.6rem;
border-radius:40px;
cursor:pointer;
}

.opt-btn{
display:block;
width:100%;
margin:10px 0;
padding:15px;
font-size:1.2rem;
border-radius:15px;
border:3px solid var(--mavi);
cursor:pointer;
}

</style>
</head>

<body>

<div id="game-container">

<div id="intro">

<h1>🏃 PIRIL İLE SPOR</h1>

<p>Pırıl'ı izle sonra soruları cevapla</p>

<button class="btn-play" onclick="startGame()">

BAŞLA

</button>

</div>


<div id="player"></div>


<div id="question-overlay">

<h2>Şimdi Sıra Sende</h2>

<p id="q-text"></p>

<div id="q-options"></div>

<div id="feedback"></div>

</div>


</div>


<script src="https://www.youtube.com/iframe_api"></script>

<script>

let player;

const START_POINT=220;
const END_POINT=597;

const questions=[

{time:START_POINT+22,
q:"Sağlığımız için şart olan nedir?",
opts:["Oyun","Egzersiz","Uyku"],
correct:1},

{time:START_POINT+50,
q:"Egzersizden önce yapılan nedir?",
opts:["Isınma","Zıplama","Uyuma"],
correct:0},

{time:START_POINT+104,
q:"Kaç tur attı?",
opts:["3","4","5"],
correct:2},

{time:START_POINT+240,
q:"Egzersiz neden önemlidir?",
opts:["Sağlık","Enerji","Hepsi"],
correct:2}

];

let currentQ=0;
let timer;


function onYouTubeIframeAPIReady(){

player=new YT.Player('player',{

height:'450',
width:'100%',
videoId:'RqviMFOWB-g',

});

}



function startGame(){

document.getElementById("intro").style.display="none";
document.getElementById("player").style.display="block";

player.seekTo(START_POINT);

player.playVideo();

timer=setInterval(checkTime,500);

}



function checkTime(){

let t=player.getCurrentTime();

if(t>=END_POINT){

finish();

}


if(currentQ<questions.length &&
t>=questions[currentQ].time){

ask();

}

}



function ask(){

player.pauseVideo();

let data=questions[currentQ];

document.getElementById("q-text").innerText=data.q;

let div=document.getElementById("q-options");

div.innerHTML="";


data.opts.forEach((o,i)=>{

let b=document.createElement("button");

b.className="opt-btn";

b.innerText=o;

b.onclick=()=>answer(i);

div.appendChild(b);

});


document.getElementById("question-overlay").style.display="block";

}



function answer(i){

let data=questions[currentQ];

let f=document.getElementById("feedback");


if(i==data.correct){

f.innerHTML="Doğru";

setTimeout(()=>{

document.getElementById("question-overlay").style.display="none";

currentQ++;

player.playVideo();

},1500);

}
else{

f.innerHTML="Tekrar dene";

}

}



function finish(){

clearInterval(timer);

player.stopVideo();

document.getElementById("player").style.display="none";

document.getElementById("intro").style.display="block";

document.getElementById("intro").innerHTML=

"<h1>Bitti</h1><button onclick='location.reload()'>Tekrar</button>";

}

</script>


</body>
</html>
