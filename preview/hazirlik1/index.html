<script>
(()=>{const root=document.getElementById('magic-mirror-show'),q=s=>root.querySelector(s),input=q('#mm-name'),reveal=q('#mm-reveal'),big=q('#mm-big-name'),parts=q('#mm-particles'),sky=q('#mm-sky'),badges=q('#mm-badges'),skybtn=q('#mm-skybtn'),nextBtn=q('#mm-activity-next');q('.mm-wrap').append(q('#mm-touch'));let names=[];
const startpage=q('#mm-startpage'),intro=q('#mm-intro'),video=q('#mm-video'),greetingAudio=q('#mm-greeting-audio');q('#mm-main-start').onclick=()=>{startpage.classList.add('mm-away');setTimeout(()=>startpage.style.display='none',680)};function openMirror(){video.pause();intro.classList.add('mm-away');greetingAudio.currentTime=0;greetingAudio.play().catch(()=>{});setTimeout(()=>intro.style.display='none',680)}q('#mm-play').onclick=async()=>{intro.classList.add('mm-playing');video.controls=true;try{await video.play()}catch(e){intro.classList.remove('mm-playing')}};q('#mm-skip').onclick=openMirror;video.onended=openMirror;video.onerror=()=>{q('#mm-play').textContent='Video bulunamadı';q('#mm-play').disabled=true};
function chime(){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),t=a.currentTime;[523,659,784,1047].forEach((f,i)=>{let o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(.001,t+i*.09);g.gain.exponentialRampToValueAtTime(.13,t+i*.09+.03);g.gain.exponentialRampToValueAtTime(.001,t+i*.09+.7);o.connect(g).connect(a.destination);o.start(t+i*.09);o.stop(t+i*.09+.75)});setTimeout(()=>a.close(),1400)}catch(e){}}
function burst(){parts.innerHTML='';for(let i=0;i<38;i++){let p=document.createElement('span');p.className='mm-particle';p.textContent=i%4?'✦':'●';p.style.color=['#fff','#ffe76c','#6ffff1','#ff72d7'][i%4];p.style.setProperty('--x',(Math.random()-.5)*900+'px');p.style.setProperty('--y',(Math.random()-.5)*600+'px');p.style.setProperty('--r',Math.random()*500+'deg');parts.append(p)}}
const mirror=q('.mm-mirror'),touch=q('#mm-touch');function activateMirror(){if(root.classList.contains('mm-on'))return;root.classList.add('mm-on');chime();burst();setTimeout(()=>input.focus(),1300)}mirror.setAttribute('role','button');mirror.setAttribute('tabindex','0');mirror.setAttribute('aria-label','Aynaya dokun');mirror.onclick=activateMirror;mirror.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activateMirror()}};touch.onclick=e=>{e.stopPropagation();activateMirror()};const activity=q('#mm-activity'),complete=q('#mm-complete'),status=q('#mm-selection-status'),choices=[...root.querySelectorAll('.mm-choice')],board=q('.mm-activity-board');const brushCover=document.createElement('span');brushCover.className='mm-remove-brush';board.append(brushCover);activity.append(q('#mm-activity-done'));function openActivity(){nextBtn.style.display='none';skybtn.style.display='none';activity.style.display='grid';activity.classList.remove('mm-away');choices.forEach(c=>{c.classList.remove('is-selected');c.setAttribute('aria-pressed','false')})}function showName(){let n=input.value.trim().toLocaleUpperCase('tr-TR');if(!n){input.focus();return}big.textContent='✨ '+n+' ✨';reveal.style.display='grid';chime();burst();if(!names.includes(n))names.push(n);setTimeout(()=>{reveal.style.display='none';input.value='';render();skybtn.style.display='block'},1800)}q('#mm-name-go').onclick=showName;input.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();showName()}};nextBtn.onclick=openActivity;choices.forEach(c=>c.onclick=()=>{c.classList.toggle('is-selected');c.setAttribute('aria-pressed',String(c.classList.contains('is-selected')));chime()});q('#mm-activity-done').onclick=()=>{if(!choices.some(c=>c.classList.contains('is-selected')))return;activity.classList.add('mm-away');setTimeout(()=>{activity.style.display='none';complete.style.display='grid';burst();chime();setTimeout(burst,500)},620)};
q('#mm-activity-done').onclick=()=>{if(!choices.some(c=>c.classList.contains('is-selected')))return;activity.classList.remove('mm-away');activity.style.display='none';complete.style.display='grid';burst();chime();setTimeout(burst,500)};
function render(){badges.innerHTML='';let w=root.clientWidth,h=root.clientHeight;names.forEach((n,i)=>{let b=document.createElement('div'),a=i/Math.max(names.length,1)*Math.PI*2-.7,r=Math.min(w,h)*.28;b.className='mm-badge';b.style.left=Math.max(5,Math.min(w-125,w/2+Math.cos(a)*r-60))+'px';b.style.top=Math.max(80,Math.min(h-125,h/2+Math.sin(a)*r-60))+'px';b.innerHTML='<i>★</i><strong>'+n.replace(/[&<>]/g,'')+'</strong>';badges.append(b)})}skybtn.onclick=()=>{render();sky.style.display='grid';burst()};q('#mm-close').onclick=()=>sky.style.display='none';q('#mm-sky-next').onclick=()=>{sky.style.display='none';openActivity()};new ResizeObserver(render).observe(root)})();
</script>
