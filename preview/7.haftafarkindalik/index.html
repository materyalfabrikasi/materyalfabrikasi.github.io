function photoFace(e){let happy=e==='happy';return `<img class="face-photo" src="${happy?'tugba.png':'esma.png?v=2'}" alt="${happy?'Mutlu Tuğba':'Üzgün mavi gözlü Esma'}">`}
function partPhoto(p){let file={head:'bas.png',shoulder:'omuz.png',knee:'diz.png',foot:'ayak.png'}[p];return `<div class="part-photo-window"><img class="part-source" src="${file}" alt="${names[p]} görsel kartı"></div>`}
function tugbaBody(){let files={head:'bas.png',shoulder:'omuz.png',knee:'diz.png',foot:'ayak.png'};return `<div class="anatomy-layout"><div class="tugba-body-card"><div class="tugba-body-stage"><div class="tugba-figure"><img class="tugba-full" src="tugba-tam-boy.png" alt="Neşeli pembe elbiseli tam boy Tuğba">${Object.keys(names).map(p=>['knee','foot'].includes(p)?['left','right'].map(side=>`<button class="anatomy-hotspot hotspot side-${side}" data-part="${p}" aria-label="Tuğba'nın ${names[p]} bölgesini seç"></button>`).join(''):`<button class="anatomy-hotspot hotspot" data-part="${p}" aria-label="Tuğba'nın ${names[p]} bölgesini seç"></button>`).join('')}</div></div></div><div class="anatomy-parts">${Object.keys(names).map(p=>`<button class="anatomy-part-card hotspot" data-part="${p}" aria-label="${names[p]} kartı"><img src="${files[p]}" alt="${names[p]}"></button>`).join('')}</div></div>`}
function motionVideo(s){let m=movementVideos[s];return `<div class="motion-stage"><div class="motion-card"><div class="motion-video-frame"><video id="motionVideo" preload="metadata" playsinline src="${m.src}" aria-label="${m.title} videosu"></video><button class="video-cover" data-video="play" aria-label="Videoyu izle"><span>▶</span></button><button class="video-replay" data-video="replay" aria-label="Tekrar izle" hidden>↻</button><div class="motion-error" hidden><div>Video açılamadı.<div class="motion-actions"><button class="motion-button secondary" data-video="retry">Tekrar Dene</button><button class="motion-button" data-video="unlock">İleri</button></div></div></div></div></div></div>`}
function helpConversation(){return `<div class="motion-stage"><div class="conversation-grid"><div class="motion-video-frame"><i class="conversation-step">1</i><video id="askEsmaVideo" preload="metadata" playsinline src="${movementVideos.askEsma.src}" aria-label="Esma, nasılsın videosu"></video><button class="video-cover" data-convo="ask" aria-label="Nasılsın videosunu izle"><span>▶</span></button><button class="video-replay" data-convo="ask" aria-label="Nasılsın videosunu tekrar izle" hidden>↻</button></div><div class="motion-video-frame"><i class="conversation-step">2</i><video id="headacheVideo" preload="metadata" playsinline src="${movementVideos.headache.src}" aria-label="Başım ağrıyor videosu"></video><button class="video-cover" data-convo="headache" aria-label="Başım ağrıyor videosunu izle"><span>▶</span></button><button class="video-replay" data-convo="headache" aria-label="Başım ağrıyor videosunu tekrar izle" hidden>↻</button></div><div class="motion-video-frame"><i class="conversation-step">3</i><video id="yourTurnVideo" preload="metadata" playsinline src="${movementVideos.yourTurn.src}" aria-label="Sen nasılsın videosu"></video><button class="video-cover" data-convo="yourTurn" aria-label="Sen nasılsın videosunu izle"><span>▶</span></button><button class="video-replay" data-convo="yourTurn" aria-label="Sen nasılsın videosunu tekrar izle" hidden>↻</button></div></div></div>`}
function surpriseMotion(a){let icon={head:'🙂',shoulder:'🙆',knee:'🧎',foot:'👟'}[a];return `<div class="motion-stage"><div class="surprise-card"><div class="motion-icon">${icon}</div><h2>${prompts[a]}</h2><p>Hareketi birlikte yapalım.</p><div class="surprise-buttons"><button class="motion-button secondary" data-motion="listen">🔊 Tekrar Dinle</button><button class="motion-button" data-motion="next">${state.task===3?'Bitir':'Yeni Hareket'} ›</button></div></div></div>`}
let activeAudio=null;const audioMap={'Mutlu yüzü göster.':'ses-mutlu-yuzu.wav','Üzgün yüzü göster.':'ses-uzgun-yuzu.wav','Başını göster.':'ses-basini.wav','Omzunu göster.':'ses-omzunu.wav','Dizini göster.':'ses-dizini.wav','Ayağını göster.':'ses-ayagini.wav','Aferin!':'ses-aferin.wav','Harika!':'ses-harika.wav','Doğru bildin!':'ses-dogru.wav','Bir daha deneyelim.':'ses-tekrar.wav','Bölüm tamamlandı!':'ses-bolum-bitti.wav'};
function playOpening(){if(!state.sound||!$('#home')?.classList.contains('active'))return;stopVoice();activeAudio=new Audio('acilis.mp3');activeAudio.preload='auto';activeAudio.play().catch(()=>{})}
function startWithOpening(){if(state.opening)return;if(!state.sound){start(0);return}state.opening=true;stopVoice();activeAudio=new Audio('acilis.mp3');activeAudio.preload='auto';let go=()=>{if(!state.opening)return;state.opening=false;start(0)};activeAudio.addEventListener('ended',go,{once:true});activeAudio.addEventListener('error',go,{once:true});activeAudio.play().catch(go)}
const animatedCharacter=character;character=(...args)=>animatedCharacter(...args).replaceAll('#513d57','#e3aa3f');
function stopVoice(){if(activeAudio){activeAudio.pause();activeAudio.currentTime=0;activeAudio=null}}
function show(id){let v=$('#motionVideo');if(v)v.pause();$$('.screen').forEach(x=>x.classList.toggle('active',x.id===id));stopVoice();if(id==='home')playOpening()}
function start(i){state.section=i;state.task=0;state.locked=false;state.card=null;if(i===4)state.motionOrder=shuffle(['head','shoulder','knee','foot']);show('game');render()}
function answer(){return state.section===1?emotion[state.task]:state.section===2?body[state.task]:state.section===3&&state.task===1?'Esma':state.section===4?state.motionOrder[state.task]:null}
function render(){state.locked=false;state.card=null;let s=state.section,a=answer(),isBodyVideo=s===2&&state.task<4,isHelpVideo=s===3&&state.task===0,text=s===0?'Sen de tekrar et.':s===1?prompts[a]:s===2?prompts[a]:'Tıkla, dinle.';$('#title').textContent=sections[s][0];$('#progress').textContent=`Bölüm ${s+1} / ${sections.length}`;$('#prompt').textContent=text;draw(s,a);let forward=$('[data-act="next"]');if(forward)forward.disabled=s===0||isBodyVideo||isHelpVideo;if(s===1||(s===2&&!isBodyVideo))setTimeout(()=>speak(s===2?prompts[a]:text),250)}
function draw(s,a){let stage=$('#stage');if(s===0){stage.innerHTML=motionVideo('hello');bindMotionVideo()}else if(s===1){let order=Math.random()>.5?['happy','sad']:['sad','happy'];stage.innerHTML=`<div class="facegrid">${order.map(e=>`<button class="choice" data-answer="${e}">${photoFace(e)}</button>`).join('')}</div>`}else if(s===2&&state.task<4){stage.innerHTML=motionVideo(a);bindMotionVideo()}else if(s===2){stage.innerHTML=tugbaBody()}else if(s===3&&state.task===0){stage.innerHTML=helpConversation();bindHelpConversation()}else if(s===3){stage.innerHTML=helpEsma()}else{stage.innerHTML=surpriseMotion(a)}}
function bindHelpConversation(){['askEsmaVideo','headacheVideo','yourTurnVideo'].forEach(id=>{let v=$('#'+id);if(!v)return;v.muted=!state.sound;v.addEventListener('ended',()=>{v.dataset.watched='yes';let frame=v.closest('.motion-video-frame');frame.querySelector('.video-cover')?.setAttribute('hidden','');frame.querySelector('.video-replay')?.removeAttribute('hidden');if(['askEsmaVideo','headacheVideo','yourTurnVideo'].every(videoId=>$('#'+videoId)?.dataset.watched==='yes')){let forward=$('[data-act="next"]');if(forward)forward.disabled=false}})})}
function playHelpConversation(which){let ids={ask:'#askEsmaVideo',headache:'#headacheVideo',yourTurn:'#yourTurnVideo'},v=$(ids[which]);if(!v)return;let frame=v.closest('.motion-video-frame');v.currentTime=0;v.muted=!state.sound;frame.querySelector('.video-cover')?.setAttribute('hidden','');frame.querySelector('.video-replay')?.setAttribute('hidden','');v.play().catch(()=>frame.querySelector('.video-cover')?.removeAttribute('hidden'))}
function bindMotionVideo(){let v=$('#motionVideo');if(!v)return;v.muted=!state.sound;v.addEventListener('ended',()=>{$('.video-cover')?.setAttribute('hidden','');$('.video-replay')?.removeAttribute('hidden');let forward=$('[data-act="next"]');if(forward)forward.disabled=false});v.addEventListener('error',()=>{$('.video-cover')?.setAttribute('hidden','');$('.motion-error')?.removeAttribute('hidden')},{once:true})}
function playMotion(restart=false){let v=$('#motionVideo');if(!v)return;if(restart)v.currentTime=0;v.muted=!state.sound;let forward=$('[data-act="next"]');if(forward)forward.disabled=true;$('.motion-error')?.setAttribute('hidden','');$('.video-replay')?.setAttribute('hidden','');$('.video-cover')?.setAttribute('hidden','');v.play().catch(()=>{$('.motion-error')?.removeAttribute('hidden')})}
function notify(t,good){let f=$('#feedback');f.textContent=t;f.className='feedback show '+(good?'good':'try');clearTimeout(notify.t);notify.t=setTimeout(()=>f.classList.remove('show'),900)}
function respond(el,a){if(state.locked)return;if(a!==answer()){el?.classList.add('wrong');notify('Bir daha deneyelim.',false);speak('Bir daha deneyelim.');setTimeout(()=>el?.classList.remove('wrong'),400);return}state.locked=true;el?.classList.add('correct');if(el?.classList.contains('hotspot'))$$(`.hotspot[data-part="${a}"]`).forEach(x=>x.classList.add('glow-'+a));let m=positive[Math.floor(Math.random()*positive.length)];notify(m,true);speak(m,()=>setTimeout(next,250))}
function next(){state.task++;if(state.task>=sections[state.section][2]){if(state.section===sections.length-1)celebrate();else{let nextSection=state.section+1;if(state.section>=1&&state.section<=5)start(nextSection);else{notify('Bölüm tamamlandı!',true);speak('Bölüm tamamlandı!',()=>start(nextSection))}}}else render()}
function speak(t,onDone){if(!state.sound){onDone?.();return}stopVoice();let file=audioMap[t];if(!file){onDone?.();return}activeAudio=new Audio(file);activeAudio.preload='auto';let finished=false,finish=()=>{if(finished)return;finished=true;if(activeAudio){activeAudio=null}onDone?.()};activeAudio.addEventListener('ended',finish,{once:true});activeAudio.addEventListener('error',finish,{once:true});activeAudio.play().catch(finish)}
function celebrate(){show('celebrate');speak('Harika!');let c=['#ffd45c','#ff897b','#62cfc2','#ad8ae0','#70c6ed'];$('#confetti').innerHTML=Array.from({length:42},(_,i)=>`<i style="left:${Math.random()*100}%;background:${c[i%5]};animation-delay:${Math.random()*2}s;animation-duration:${2.5+Math.random()*2}s"></i>`).join('')}
$('.app').insertAdjacentHTML('afterbegin',`<div class="ambient-world" aria-hidden="true">${Array.from({length:12},(_,i)=>`<i class="bubble" style="left:${4+i*8.3}%;width:${28+(i%5)*13}px;height:${28+(i%5)*13}px;--time:${12+(i%4)*3}s;--delay:-${i*1.7}s"></i>`).join('')}${Array.from({length:9},(_,i)=>`<b class="float-star" style="left:${8+i*11}%;--size:${18+(i%4)*5}px;--color:${['#f6bf35','#65cdbd','#b698e8','#ff8c7c'][i%4]};--time:${15+(i%3)*4}s;--delay:-${i*2.3}s">★</b>`).join('')}</div>`);
document.addEventListener('click',e=>{let act=e.target.closest('[data-act]')?.dataset.act;if(act==='start')startWithOpening();if(act==='home')show('home');if(act==='next'&&!state.locked){state.locked=true;next()}if(act==='replay'){state.stars=0;$('#stars').textContent=0;start(0)}let video=e.target.closest('[data-video]')?.dataset.video;if(video==='play'||video==='replay')playMotion(video==='replay');if(video==='retry'){let v=$('#motionVideo');if(v){v.load();playMotion(true)}}if(video==='unlock'){let forward=$('[data-act="next"]');if(forward)forward.disabled=false;$('.motion-error')?.setAttribute('hidden','')}let convo=e.target.closest('[data-convo]')?.dataset.convo;if(convo)playHelpConversation(convo);let motion=e.target.closest('[data-motion]')?.dataset.motion;if(motion==='listen')speak(prompts[answer()]);if(motion==='next')next();let ch=e.target.closest('[data-answer]');if(ch)respond(ch,ch.dataset.answer);let help=e.target.closest('[data-help]');if(help)respond(help,help.dataset.help);let spot=e.target.closest('.hotspot');if(spot)respond(spot,spot.dataset.part)});
$('.hud').insertAdjacentHTML('beforeend','<button class="icon fullscreen-icon" id="fullscreen" aria-label="Tam ekran">⛶</button>');$('#sound').onclick=()=>{if($('#home').classList.contains('active')){if(activeAudio&&!activeAudio.paused){state.opening=false;state.sound=false;stopVoice();$('#sound').textContent='🔇'}else{state.sound=true;$('#sound').textContent='🔊';playOpening()}return}state.sound=!state.sound;$('#sound').textContent=state.sound?'🔊':'🔇';if(!state.sound)stopVoice();let v=$('#motionVideo');if(v)v.muted=!state.sound};$('#repeat').onclick=e=>{e.stopPropagation();speak(state.section===2&&state.task>=4?prompts[answer()]:$('#prompt').textContent)};$('#menuTop').onclick=()=>show('home');$('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();setTimeout(playOpening,350);
</script></body></html>
