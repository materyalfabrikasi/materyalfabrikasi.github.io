<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Benim Ülkem</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      background: #dff3fb;
      font-family: Arial, sans-serif;
    }
    .opening-screen {
      position: relative;
      width: min(100vw, calc(100vh * 2.0595));
      aspect-ratio: 1800 / 874;
      max-height: 100vh;
    }
    .opening-screen img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .start-button {
      position: absolute;
      left: 40.8%;
      top: 71.7%;
      width: 18.8%;
      height: 13.4%;
      border: 0;
      border-radius: 22px;
      background: transparent;
      cursor: pointer;
    }
    .start-button:focus-visible {
      outline: 5px solid #17498c;
      outline-offset: 4px;
    }
    .start-button:active { transform: scale(.97); }
    .flag-screen {
      display: none;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      padding: clamp(20px, 4vw, 64px);
      place-items: center;
      background:
        radial-gradient(circle at 12% 16%, rgba(255, 193, 89, .28) 0, rgba(255, 193, 89, 0) 24%),
        radial-gradient(circle at 88% 82%, rgba(73, 183, 220, .24) 0, rgba(73, 183, 220, 0) 28%),
        linear-gradient(135deg, #f5fbff 0%, #fffaf1 48%, #e6f7ff 100%);
    }
    .flag-screen::before,
    .flag-screen::after,
    .game-screen::before,
    .game-screen::after {
      content: '';
      position: absolute;
      z-index: -1;
      width: 34vw;
      height: 34vw;
      border-radius: 50%;
      filter: blur(2px);
      opacity: .55;
    }
    .flag-screen::before,
    .game-screen::before {
      left: -12vw;
      top: -17vw;
      background: linear-gradient(145deg, rgba(27, 153, 203, .28), rgba(65, 191, 199, .08));
    }
    .flag-screen::after,
    .game-screen::after {
      right: -13vw;
      bottom: -18vw;
      background: linear-gradient(145deg, rgba(248, 181, 72, .22), rgba(255, 230, 160, .06));
    }
    .flag-screen.active { display: grid; }
    .flag-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      width: min(92vw, 1040px);
      padding: clamp(18px, 3vw, 36px);
      border: 1px solid rgba(255, 255, 255, .9);
      border-radius: 34px;
      background: rgba(255, 255, 255, .74);
      box-shadow: 0 24px 60px rgba(31, 101, 151, .17), inset 0 1px 0 #ffffff;
      backdrop-filter: blur(8px);
    }
    .flag-content img {
      display: block;
      width: min(74vw, 850px);
      max-height: 54vh;
      object-fit: contain;
      filter: drop-shadow(0 18px 24px rgba(73, 25, 25, .18));
    }
    .turkey-name-button {
      min-width: 230px;
      padding: 8px 28px;
      border: 3px solid #1591c9;
      border-radius: 18px;
      background: rgba(255, 255, 255, .92);
      color: #173f73;
      font: 700 clamp(28px, 3.2vw, 44px) Arial, sans-serif;
      letter-spacing: 2px;
      box-shadow: 0 7px 0 rgba(10, 100, 140, .28);
      cursor: pointer;
    }
    .turkey-name-button:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 rgba(10, 100, 140, .28);
    }
    .listen-button, .next-button {
      min-width: 180px;
      min-height: 54px;
      padding: 12px 26px;
      border: 2px solid rgba(255, 255, 255, .82);
      border-radius: 17px;
      background: linear-gradient(135deg, #17679e 0%, #168fae 100%);
      color: #ffffff;
      font: 700 clamp(20px, 2vw, 28px) Arial, sans-serif;
      box-shadow: 0 7px 0 #0b527b, 0 11px 22px rgba(17, 91, 135, .20);
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }
    .next-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
    }
    .button-arrow {
      display: inline-grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .19);
      font-size: 29px;
      line-height: 1;
      transition: transform .2s ease;
    }
    .next-button:not(:disabled):hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
      box-shadow: 0 9px 0 #0b527b, 0 15px 26px rgba(17, 91, 135, .24);
    }
    .next-button:not(:disabled):hover .button-arrow {
      transform: translateX(4px);
    }
    .listen-button:active, .next-button:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #0b527b;
    }
    .flag-actions, .game-actions {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      flex-wrap: nowrap;
    }
    .new-game-button {
      min-width: 170px;
      min-height: 54px;
      padding: 12px 26px;
      border: 3px solid #123c74;
      border-radius: 18px;
      background: #1f65b7;
      color: #ffffff;
      font: 700 clamp(19px, 2vw, 27px) Arial, sans-serif;
      box-shadow: 0 7px 0 #123c74;
      cursor: pointer;
    }
    .new-game-button:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #123c74;
    }
    /* Türkiye'nin Bayrağını Bul mini oyunu */
    .turkey-find-screen {
      display: none;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      padding: clamp(12px, 2.2vw, 30px);
      place-items: center;
      background:
        radial-gradient(circle at 12% 15%, rgba(255, 214, 135, .22) 0, transparent 24%),
        radial-gradient(circle at 88% 84%, rgba(48, 174, 211, .20) 0, transparent 28%),
        linear-gradient(135deg, #edf9ff 0%, #f9fcff 52%, #dff4fc 100%);
    }
    .turkey-find-screen.active { display: grid; }
    .turkey-find-screen::before,
    .turkey-find-screen::after {
      content: '';
      position: absolute;
      z-index: -1;
      width: 34vw;
      height: 34vw;
      border-radius: 50%;
      opacity: .5;
    }
    .turkey-find-screen::before {
      left: -14vw;
      top: -18vw;
      background: linear-gradient(145deg, rgba(23, 103, 158, .2), rgba(39, 168, 174, .04));
    }
    .turkey-find-screen::after {
      right: -13vw;
      bottom: -18vw;
      background: linear-gradient(145deg, rgba(39, 168, 174, .16), rgba(255, 255, 255, 0));
    }
    .find-panel {
      width: min(95vw, 1180px);
      min-height: min(90vh, 720px);
      max-height: 94vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(12px, 2vh, 22px);
      padding: clamp(18px, 3vw, 38px);
      border: 1px solid rgba(255, 255, 255, .94);
      border-radius: 34px;
      background: rgba(255, 255, 255, .78);
      box-shadow: 0 24px 60px rgba(31, 101, 151, .17), inset 0 1px 0 #ffffff;
      backdrop-filter: blur(8px);
      text-align: center;
    }
    .find-view { display: none; width: 100%; }
    .find-view.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 2.2vh, 24px);
      animation: screen-enter .48s ease both;
    }
    .find-title {
      margin: 0;
      color: #173f73;
      font-size: clamp(34px, 5vw, 64px);
      line-height: 1.08;
    }
    .find-description {
      max-width: 790px;
      margin: 0;
      color: #315b79;
      font-size: clamp(20px, 2.4vw, 31px);
      font-weight: 600;
      line-height: 1.35;
    }
    .find-primary,
    .find-secondary,
    .find-continue {
      min-height: 58px;
      padding: 13px 28px;
      border-radius: 18px;
      color: #ffffff;
      font: 700 clamp(19px, 2vw, 27px) Arial, sans-serif;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, filter .2s ease;
    }
    .find-primary,
    .find-continue {
      border: 2px solid rgba(255, 255, 255, .82);
      background: linear-gradient(135deg, #17679e, #168fae);
      box-shadow: 0 7px 0 #0b527b, 0 12px 22px rgba(17, 91, 135, .2);
    }
    .find-secondary {
      border: 3px solid #17679e;
      background: #ffffff;
      color: #174f7a;
      box-shadow: 0 6px 0 rgba(23, 103, 158, .22);
    }
    .find-primary:hover,
    .find-secondary:hover,
    .find-continue:hover { transform: translateY(-2px); filter: brightness(1.04); }
    .find-primary:active,
    .find-secondary:active,
    .find-continue:active { transform: translateY(3px); }
    .find-play-header {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }
    .find-instruction {
      grid-column: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0;
      color: #173f73;
      font-size: clamp(25px, 3.2vw, 42px);
      font-weight: 700;
    }
    .speaker-button,
    .feedback-speaker {
      display: inline-grid;
      place-items: center;
      flex: 0 0 auto;
      width: 52px;
      height: 52px;
      padding: 0;
      border: 2px solid #168fae;
      border-radius: 50%;
      background: #ffffff;
      color: #17679e;
      font-size: 25px;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(22, 143, 174, .22);
    }
    .find-progress {
      grid-column: 3;
      justify-self: end;
      min-width: 82px;
      padding: 8px 15px;
      border-radius: 999px;
      background: #e4f5fb;
      color: #174f7a;
      font-size: clamp(19px, 2vw, 27px);
      font-weight: 700;
    }
    .find-dots {
      display: flex;
      justify-content: center;
      gap: 9px;
    }
    .find-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #c4dce8;
      transition: transform .25s ease, background .25s ease;
    }
    .find-dot.current { background: #168fae; transform: scale(1.28); }
    .find-dot.done { background: #35a66f; }
    .find-flags {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(12px, 2vw, 25px);
    }
    .find-flag-card {
      position: relative;
      aspect-ratio: 3 / 2;
      min-width: 0;
      padding: clamp(7px, 1vw, 12px);
      border: 3px solid #d6e7ef;
      border-radius: 24px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 12px 24px rgba(31, 101, 151, .14);
      cursor: pointer;
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .find-flag-card:hover { transform: translateY(-4px); border-color: #71bfd4; }
    .find-flag-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 14px;
    }
    .find-flag-card.correct {
      border-color: #35a66f;
      transform: scale(1.045);
      box-shadow: 0 0 0 6px rgba(53, 166, 111, .14), 0 16px 30px rgba(31, 101, 151, .18);
    }
    .find-flag-card.try-again { animation: gentle-shake .35s ease; }
    .card-sparkle {
      position: absolute;
      color: #f3b41b;
      font-size: clamp(22px, 3vw, 38px);
      pointer-events: none;
      animation: sparkle-pop .9s ease-out forwards;
    }
    .card-sparkle.one { left: 12%; top: 12%; }
    .card-sparkle.two { right: 12%; top: 20%; animation-delay: .08s; }
    .card-sparkle.three { right: 22%; bottom: 10%; animation-delay: .16s; }
    .find-feedback-row {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .find-feedback {
      margin: 0;
      color: #174f7a;
      font-size: clamp(21px, 2.4vw, 31px);
      font-weight: 700;
    }
    .feedback-speaker { width: 44px; height: 44px; font-size: 21px; }
    .feedback-speaker[hidden] { display: none; }
    .finish-stars {
      display: flex;
      gap: 18px;
      color: #efb321;
      font-size: clamp(32px, 5vw, 56px);
    }
    .finish-stars span { animation: finish-star 1.5s ease-in-out infinite alternate; }
    .finish-stars span:nth-child(2) { animation-delay: .25s; }
    .finish-stars span:nth-child(3) { animation-delay: .5s; }
    .find-finish-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .find-confetti-layer {
      position: absolute;
      inset: 0;
      z-index: 10;
      overflow: hidden;
      pointer-events: none;
    }
    .find-confetti-piece {
      position: absolute;
      top: -24px;
      width: 11px;
      height: 18px;
      border-radius: 3px;
      opacity: 0;
      animation: find-confetti-fall 1.35s ease-out forwards;
    }
    @keyframes gentle-shake {
      0%, 100% { transform: translateX(0); }
      35% { transform: translateX(-5px); }
      70% { transform: translateX(5px); }
    }
    @keyframes sparkle-pop {
      0% { opacity: 0; transform: scale(.4) rotate(-15deg); }
      35% { opacity: 1; transform: scale(1.2) rotate(8deg); }
      100% { opacity: 0; transform: scale(.75) translateY(-18px); }
    }
    @keyframes finish-star {
      from { transform: translateY(2px) scale(.92); opacity: .72; }
      to { transform: translateY(-5px) scale(1.08); opacity: 1; }
    }
    @keyframes find-confetti-fall {
      0% { opacity: 0; transform: translate3d(0, -25px, 0) rotate(0deg); }
      12% { opacity: 1; }
      100% { opacity: 0; transform: translate3d(var(--drift), 102vh, 0) rotate(var(--turn)); }
    }
    .activity-complete-screen {
      display: none;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      padding: 24px;
      place-items: center;
      background:
        radial-gradient(circle at 16% 18%, rgba(239, 179, 33, .20) 0, transparent 23%),
        radial-gradient(circle at 84% 82%, rgba(39, 168, 174, .22) 0, transparent 28%),
        linear-gradient(135deg, #eefaff 0%, #fffaf0 52%, #e1f6fb 100%);
    }
    .activity-complete-screen.active { display: grid; }
    .complete-card {
      position: relative;
      z-index: 2;
      width: min(90vw, 850px);
      min-height: min(70vh, 520px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: clamp(24px, 5vw, 54px);
      border: 1px solid rgba(255, 255, 255, .94);
      border-radius: 38px;
      background: rgba(255, 255, 255, .84);
      box-shadow: 0 26px 65px rgba(31, 101, 151, .18), inset 0 1px 0 #ffffff;
      text-align: center;
      animation: screen-enter .55s ease both;
    }
    .complete-title {
      margin: 0;
      color: #173f73;
      font-size: clamp(40px, 6vw, 76px);
      line-height: 1.08;
    }
    .complete-stars {
      display: flex;
      gap: clamp(15px, 3vw, 30px);
      color: #efb321;
      font-size: clamp(42px, 7vw, 76px);
    }
    .complete-stars span { animation: finish-star 1.3s ease-in-out infinite alternate; }
    .complete-stars span:nth-child(2) { animation-delay: .18s; }
    .complete-stars span:nth-child(3) { animation-delay: .36s; }
    .complete-home-button {
      min-height: 58px;
      padding: 13px 30px;
      border: 2px solid rgba(255, 255, 255, .82);
      border-radius: 18px;
      background: linear-gradient(135deg, #17679e, #168fae);
      color: #ffffff;
      font: 700 clamp(20px, 2.2vw, 29px) Arial, sans-serif;
      box-shadow: 0 7px 0 #0b527b, 0 12px 22px rgba(17, 91, 135, .2);
      cursor: pointer;
    }
    .complete-home-button:active { transform: translateY(4px); box-shadow: 0 3px 0 #0b527b; }
    .game-screen {
      display: none;
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      padding: clamp(10px, 2vw, 24px);
      background:
        radial-gradient(circle at 18% 12%, rgba(255, 201, 108, .24) 0, rgba(255, 201, 108, 0) 22%),
        radial-gradient(circle at 82% 88%, rgba(50, 177, 213, .23) 0, rgba(50, 177, 213, 0) 27%),
        linear-gradient(135deg, #f4fbff 0%, #fffaf2 50%, #e2f6ff 100%);
      text-align: center;
    }
    .game-screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .game-screen > * { position: relative; z-index: 1; }
    .game-screen h1 {
      margin: 0 0 2px;
      padding: 9px 28px;
      border: 1px solid rgba(255, 255, 255, .94);
      border-radius: 22px;
      background: rgba(255, 255, 255, .72);
      color: #173f73;
      font-size: clamp(28px, 4vw, 50px);
      box-shadow: 0 12px 28px rgba(31, 101, 151, .12);
    }
    .memory-grid {
      width: min(90vw, 1040px);
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(12px, 1.4vw, 20px);
    }
    .memory-card {
      height: min(24vh, 190px);
      padding: 0;
      border: 0;
      border-radius: 18px;
      background: transparent;
      perspective: 900px;
      cursor: pointer;
    }
    .card-inner {
      display: block;
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .45s;
      transform-style: preserve-3d;
    }
    .memory-card.flipped .card-inner,
    .memory-card.matched .card-inner { transform: rotateY(180deg); }
    .card-face {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 18px;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      overflow: hidden;
      box-shadow: 0 10px 14px rgba(28, 85, 122, .17);
    }
    .card-front {
      transform: rotateY(0deg) translateZ(1px);
      border: 3px solid #eda01e;
      background:
        radial-gradient(circle at 24% 25%, rgba(255, 255, 255, .27) 0 7%, transparent 8%),
        radial-gradient(circle at 76% 72%, rgba(255, 255, 255, .18) 0 8%, transparent 9%),
        linear-gradient(145deg, #ffd45a 0%, #f5a52b 55%, #ee861c 100%);
      box-shadow:
        inset 0 0 0 5px rgba(255, 255, 255, .20),
        inset 0 -14px 24px rgba(170, 84, 7, .10),
        0 10px 18px rgba(127, 82, 21, .18);
    }
    .card-front::before {
      content: '';
      position: absolute;
      top: -45%;
      left: -18%;
      width: 52%;
      height: 190%;
      transform: rotate(24deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .13), transparent);
    }
    .memory-card:hover .card-front {
      filter: brightness(1.07);
    }
    .card-back {
      padding: 3px;
      border: 3px solid #1591c9;
      background: #ffffff;
      transform: rotateY(180deg) translateZ(1px);
    }
    .card-back img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .memory-card.matched .card-back {
      border-color: #25a65a;
      box-shadow: 0 0 0 5px rgba(37, 166, 90, .18);
    }
    .memory-card.removed {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .35s;
    }
    .game-feedback {
      min-height: 34px;
      margin: 0;
      color: #173f73;
      font-size: clamp(20px, 2.4vw, 30px);
      font-weight: 700;
    }
    .game-page-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 54px;
    }
    .game-page-nav .next-button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
      box-shadow: 0 7px 0 #0b527b;
    }
    .game-page-nav strong {
      min-width: 64px;
      color: #173f73;
      font-size: clamp(20px, 2vw, 28px);
    }
    .flag-screen.active .flag-content,
    .game-screen.active h1,
    .game-screen.active .game-page-nav,
    .game-screen.active .game-feedback {
      animation: screen-enter .5s ease both;
    }
    .memory-grid.page-enter {
      animation: cards-enter .48s ease both;
    }
    @keyframes screen-enter {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes cards-enter {
      from { opacity: 0; transform: translateX(24px) scale(.985); }
      to { opacity: 1; transform: translateX(0) scale(1); }
    }
    @media (max-width: 650px) {
      .flag-actions { flex-wrap: wrap; }
      .memory-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .memory-card { height: min(18vh, 110px); }
      .find-panel { min-height: 94vh; padding: 14px; gap: 10px; border-radius: 24px; }
      .find-view.active { gap: 11px; }
      .find-play-header { grid-template-columns: 1fr auto; }
      .find-instruction { grid-column: 1; justify-self: start; text-align: left; }
      .find-progress { grid-column: 2; }
      .speaker-button { width: 44px; height: 44px; font-size: 21px; }
      .find-flags { gap: 7px; }
      .find-flag-card { padding: 4px; border-radius: 15px; border-width: 2px; }
      .find-flag-card img { border-radius: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .card-inner, .next-button, .button-arrow { transition: none; }
      .flag-screen.active .flag-content,
      .game-screen.active h1,
      .game-screen.active .game-page-nav,
      .game-screen.active .game-feedback,
      .memory-grid.page-enter { animation: none; }
      .find-view.active,
      .find-flag-card.try-again,
      .card-sparkle,
      .finish-stars span,
      .find-confetti-piece { animation: none; }
    }
  </style>
</head>
<body>
  <main class="opening-screen" aria-label="Benim Ülkem etkinliği açılış ekranı">
    <img src="acilis-ekrani.png" alt="Ülkem Yanımda ile Türkçe ve Türk Kültürü derslerine hoş geldiniz">
    <button class="start-button" id="start-button" type="button" aria-label="Başlat"></button>
    <audio id="opening-audio" preload="auto" src="acilis.mp3"></audio>
  </main>
  <section class="flag-screen" id="flag-screen" aria-label="Türk bayrağı sayfası">
    <div class="flag-content">
      <button class="turkey-name-button" id="turkey-name-button" type="button" aria-label="Türkiye adını dinle">TÜRKİYE</button>
      <img src="turk_bayragi_2893.png" alt="Türk bayrağı">
      <div class="flag-actions">
        <button class="listen-button" id="listen-button" type="button">▶ Dinle</button>
        <button class="next-button" id="game-button" type="button"><span>İleri</span><span class="button-arrow" aria-hidden="true">→</span></button>
      </div>
      <audio id="flag-music" preload="metadata" src="EBA.mp3"></audio>
    </div>
  </section>
  <section class="turkey-find-screen" id="turkey-find-screen" aria-label="Türkiye'nin Bayrağını Bul oyunu">
    <div class="find-panel">
      <div class="find-view active" id="find-intro">
        <h1 class="find-title">TÜRK BAYRAĞINI BUL</h1>
        <button class="find-primary" id="find-start-button" type="button">BAŞLA</button>
      </div>

      <div class="find-view" id="find-play">
        <div class="find-play-header">
          <p class="find-instruction">
            <span>TÜRK BAYRAĞINI BUL</span>
            <button class="speaker-button" id="instruction-speaker" type="button" aria-label="Yönergeyi dinle">🔊</button>
          </p>
          <div class="find-progress" id="find-progress" aria-label="Oyun ilerlemesi">1 / 5</div>
        </div>
        <div class="find-dots" id="find-dots" aria-hidden="true"></div>
        <div class="find-flags" id="find-flags"></div>
        <div class="find-feedback-row" aria-live="polite">
          <p class="find-feedback" id="find-feedback">Bir bayrak seç.</p>
          <button class="feedback-speaker" id="feedback-speaker" type="button" aria-label="Mesajı dinle" hidden>🔊</button>
        </div>
      </div>

      <div class="find-view" id="find-finish">
        <div class="finish-stars" aria-hidden="true"><span>★</span><span>★</span><span>★</span></div>
        <h1 class="find-title">Tebrikler!</h1>
        <div class="find-finish-actions">
          <button class="find-primary" id="find-replay-button" type="button">TEKRAR OYNA</button>
          <button class="find-secondary" id="find-home-button" type="button">BAŞA DÖN</button>
          <button class="find-continue" id="find-continue-button" type="button">SONRAKİ OYUN →</button>
        </div>
      </div>
    </div>
    <div class="find-confetti-layer" id="find-confetti-layer" aria-hidden="true"></div>
  </section>
  <section class="game-screen" id="game-screen" aria-label="Bayrak eşini bul oyunu">
    <h1>Bayrakların Eşini Bul</h1>
    <div class="memory-grid" id="memory-grid"></div>
    <div class="game-page-nav">
      <strong id="page-indicator">1 / 5</strong>
      <button class="next-button" id="next-game-page" type="button" disabled><span>İleri</span><span class="button-arrow" aria-hidden="true">→</span></button>
    </div>
    <p class="game-feedback" id="game-feedback" aria-live="polite">İki karta dokun</p>
    <div class="game-actions">
      <button class="new-game-button" id="new-game-button" type="button" hidden>Yeni Bayraklar</button>
    </div>
  </section>
  <section class="activity-complete-screen" id="activity-complete-screen" aria-label="Etkinlik tamamlandı">
    <div class="complete-card">
      <div class="complete-stars" aria-hidden="true"><span>★</span><span>★</span><span>★</span></div>
      <h1 class="complete-title">ETKİNLİK TAMAMLANDI!</h1>
      <button class="complete-home-button" id="complete-home-button" type="button">BAŞA DÖN</button>
    </div>
    <div class="find-confetti-layer" id="complete-confetti-layer" aria-hidden="true"></div>
  </section>
  <script>
    const openingScreen = document.querySelector('.opening-screen');
    const startButton = document.getElementById('start-button');
    const openingAudio = document.getElementById('opening-audio');
    const flagScreen = document.getElementById('flag-screen');
    const listenButton = document.getElementById('listen-button');
    const turkeyNameButton = document.getElementById('turkey-name-button');
    const flagMusic = document.getElementById('flag-music');
    const gameButton = document.getElementById('game-button');
    const turkeyFindScreen = document.getElementById('turkey-find-screen');
    const findIntro = document.getElementById('find-intro');
    const findPlay = document.getElementById('find-play');
    const findFinish = document.getElementById('find-finish');
    const findStartButton = document.getElementById('find-start-button');
    const instructionSpeaker = document.getElementById('instruction-speaker');
    const findProgress = document.getElementById('find-progress');
    const findDots = document.getElementById('find-dots');
    const findFlags = document.getElementById('find-flags');
    const findFeedback = document.getElementById('find-feedback');
    const feedbackSpeaker = document.getElementById('feedback-speaker');
    const findConfettiLayer = document.getElementById('find-confetti-layer');
    const findReplayButton = document.getElementById('find-replay-button');
    const findHomeButton = document.getElementById('find-home-button');
    const findContinueButton = document.getElementById('find-continue-button');
    const gameScreen = document.getElementById('game-screen');
    const activityCompleteScreen = document.getElementById('activity-complete-screen');
    const completeConfettiLayer = document.getElementById('complete-confetti-layer');
    const completeHomeButton = document.getElementById('complete-home-button');
    const memoryGrid = document.getElementById('memory-grid');
    const pageIndicator = document.getElementById('page-indicator');
    const nextGamePage = document.getElementById('next-game-page');
    const gameFeedback = document.getElementById('game-feedback');
    const newGameButton = document.getElementById('new-game-button');
    const findCorrectText = 'Harika! Türk bayrağını buldun.';

    // Bayraklar çevrim dışı çalışması için HTML içine gömülü SVG olarak tutulur.
    function embeddedFlag(svg) {
      return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
    }

    const findCountries = [
      { name: 'Türkiye', image: 'turk_bayragi_2893.png', turkey: true },
      { name: 'Almanya', image: embeddedFlag('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2"><path fill="#000" d="M0 0h3v.667H0z"/><path fill="#d00" d="M0 .667h3v.666H0z"/><path fill="#ffce00" d="M0 1.333h3V2H0z"/></svg>') },
      { name: 'Hollanda', image: embeddedFlag('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2"><path fill="#ae1c28" d="M0 0h3v.667H0z"/><path fill="#fff" d="M0 .667h3v.666H0z"/><path fill="#21468b" d="M0 1.333h3V2H0z"/></svg>') },
      { name: 'Belçika', image: embeddedFlag('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2"><path fill="#000" d="M0 0h1v2H0z"/><path fill="#ffd90c" d="M1 0h1v2H1z"/><path fill="#ef3340" d="M2 0h1v2H2z"/></svg>') },
      { name: 'Fransa', image: embeddedFlag('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2"><path fill="#0055a4" d="M0 0h1v2H0z"/><path fill="#fff" d="M1 0h1v2H1z"/><path fill="#ef4135" d="M2 0h1v2H2z"/></svg>') },
      { name: 'İtalya', image: embeddedFlag('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2"><path fill="#009246" d="M0 0h1v2H0z"/><path fill="#fff" d="M1 0h1v2H1z"/><path fill="#ce2b37" d="M2 0h1v2H2z"/></svg>') },
      { name: 'İsveç', image: embeddedFlag('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 10"><path fill="#006aa7" d="M0 0h16v10H0z"/><path fill="#fecc00" d="M5 0h2v10H5zM0 4h16v2H0z"/></svg>') },
      { name: 'Norveç', image: embeddedFlag('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 16"><path fill="#ba0c2f" d="M0 0h22v16H0z"/><path fill="#fff" d="M6 0h4v16H6zM0 6h22v4H0z"/><path fill="#00205b" d="M7 0h2v16H7zM0 7h22v2H0z"/></svg>') },
      { name: 'Danimarka', image: embeddedFlag('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 37 28"><path fill="#c8102e" d="M0 0h37v28H0z"/><path fill="#fff" d="M12 0h4v28h-4zM0 12h37v4H0z"/></svg>') },
      { name: 'Finlandiya', image: embeddedFlag('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 11"><path fill="#fff" d="M0 0h18v11H0z"/><path fill="#003580" d="M5 0h3v11H5zM0 4h18v3H0z"/></svg>') },
      { name: 'İrlanda', image: embeddedFlag('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2"><path fill="#169b62" d="M0 0h1v2H0z"/><path fill="#fff" d="M1 0h1v2H1z"/><path fill="#ff883e" d="M2 0h1v2H2z"/></svg>') },
      { name: 'Romanya', image: embeddedFlag('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2"><path fill="#002b7f" d="M0 0h1v2H0z"/><path fill="#fcd116" d="M1 0h1v2H1z"/><path fill="#ce1126" d="M2 0h1v2H2z"/></svg>') },
      { name: 'Bulgaristan', image: embeddedFlag('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3 2"><path fill="#fff" d="M0 0h3v.667H0z"/><path fill="#00966e" d="M0 .667h3v.666H0z"/><path fill="#d62612" d="M0 1.333h3V2H0z"/></svg>') }
    ];
    const countries = [
      { name: 'Türkiye', image: 'turk_bayragi_2893.png', audio: 'Türkiye.wav' },
      { name: 'Amerika Birleşik Devletleri', image: 'Amerika Birleşik Devletleri.png', audio: 'Amerika Birleşik Devletleri.wav' },
      { name: 'Bosna Hersek', image: 'Bosna Hersek.png', audio: 'bosna hersek.wav' },
      { name: 'Bulgaristan', image: 'Bulgaristan.png', audio: 'bulgaristan.wav' },
      { name: 'Çin', image: 'Çin.png', audio: 'çin.wav' },
      { name: 'Danimarka', image: 'Danimarka.png', audio: 'danimarka.wav' },
      { name: 'Etiyopya', image: 'Etiyopya.png', audio: 'etiyopya.wav' },
      { name: 'Finlandiya', image: 'Finlandiya.png', audio: 'finlandiya.wav' },
      { name: 'Hollanda', image: 'Hollanda.png', audio: 'hollanda.wav' },
      { name: 'İrlanda', image: 'İrlanda.png', audio: 'irlanda.wav' },
      { name: 'İspanya', image: 'İspanya.png', audio: 'ispanya.wav' },
      { name: 'İsveç', image: 'İsveç.png', audio: 'isveç.wav' },
      { name: 'İtalya', image: 'İtalya.png', audio: 'italya.wav' },
      { name: 'İzlanda', image: 'İzlanda.png', audio: 'izlanda.wav' },
      { name: 'Kanada', image: 'Kanada.png', audio: 'kanada.wav' },
      { name: 'Karadağ', image: 'Karadağ.png', audio: 'karadağ.wav' },
      { name: 'Norveç', image: 'Norveç.png', audio: 'norveç.wav' },
      { name: 'Romanya', image: 'Romanya.png', audio: 'romanya.wav' },
      { name: 'Senegal', image: 'Senegal.png', audio: 'senegal.wav' }
    ];
    let openCards = [];
    let matchedPairs = 0;
    let boardLocked = false;
    let gamePages = [];
    let currentGamePage = 0;
    let matchAudioContext;
    const countryAudio = new Audio();
    let findRounds = [];
    let findRoundIndex = 0;
    let findRoundLocked = false;
    let findRoundTimer;
    const findInstructionAudio = new Audio('türk bayrağını bul.wav');
    const findSuccessAudio = new Audio('harika.wav');

    function speakTurkish(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'tr-TR';
      utterance.rate = .88;
      utterance.pitch = 1.05;
      const turkishVoice = window.speechSynthesis.getVoices().find(voice => voice.lang.toLowerCase().startsWith('tr'));
      if (turkishVoice) utterance.voice = turkishVoice;
      window.speechSynthesis.speak(utterance);
    }

    function launchFindConfetti(layer = findConfettiLayer, amount = 34) {
      const colors = ['#e30a17', '#ffffff', '#efb321', '#168fae', '#17679e'];
      layer.innerHTML = '';
      for (let index = 0; index < amount; index += 1) {
        const piece = document.createElement('span');
        piece.className = 'find-confetti-piece';
        piece.style.left = `${4 + Math.random() * 92}%`;
        piece.style.background = colors[index % colors.length];
        piece.style.animationDelay = `${Math.random() * .22}s`;
        piece.style.animationDuration = `${1.05 + Math.random() * .45}s`;
        piece.style.setProperty('--drift', `${-80 + Math.random() * 160}px`);
        piece.style.setProperty('--turn', `${360 + Math.random() * 540}deg`);
        layer.appendChild(piece);
      }
      setTimeout(() => { layer.innerHTML = ''; }, 1700);
    }

    function playCountryName(source) {
      countryAudio.pause();
      countryAudio.src = source;
      countryAudio.currentTime = 0;
      countryAudio.play();
    }

    function playMatchSound() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      matchAudioContext = matchAudioContext || new AudioContextClass();
      if (matchAudioContext.state === 'suspended') matchAudioContext.resume();
      const start = matchAudioContext.currentTime;
      [523.25, 659.25, 783.99].forEach((frequency, index) => {
        const oscillator = matchAudioContext.createOscillator();
        const gain = matchAudioContext.createGain();
        const noteStart = start + index * .11;
        oscillator.type = 'sine';
        oscillator.frequency.value = frequency;
        gain.gain.setValueAtTime(.0001, noteStart);
        gain.gain.exponentialRampToValueAtTime(.16, noteStart + .025);
        gain.gain.exponentialRampToValueAtTime(.0001, noteStart + .28);
        oscillator.connect(gain);
        gain.connect(matchAudioContext.destination);
        oscillator.start(noteStart);
        oscillator.stop(noteStart + .3);
      });
    }

    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function showFindView(view) {
      [findIntro, findPlay, findFinish].forEach(item => item.classList.remove('active'));
      view.classList.add('active');
    }

    function showTurkeyFindIntro() {
      clearTimeout(findRoundTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      flagScreen.classList.remove('active');
      gameScreen.classList.remove('active');
      turkeyFindScreen.classList.add('active');
      showFindView(findIntro);
    }

    function showActivityComplete() {
      gameScreen.classList.remove('active');
      activityCompleteScreen.classList.add('active');
      launchFindConfetti(completeConfettiLayer, 58);
    }

    function returnToOpeningScreen() {
      clearTimeout(findRoundTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      openingAudio.pause();
      openingAudio.currentTime = 0;
      flagMusic.pause();
      findInstructionAudio.pause();
      findSuccessAudio.pause();
      countryAudio.pause();
      flagScreen.classList.remove('active');
      turkeyFindScreen.classList.remove('active');
      gameScreen.classList.remove('active');
      activityCompleteScreen.classList.remove('active');
      openingScreen.style.display = '';
      startButton.disabled = false;
    }

    function startTurkeyFindGame() {
      clearTimeout(findRoundTimer);
      const turkey = findCountries.find(country => country.turkey);
      const distractors = shuffle(findCountries.filter(country => !country.turkey)).slice(0, 10);
      findRounds = Array.from({ length: 5 }, (_, index) =>
        shuffle([turkey, distractors[index * 2], distractors[index * 2 + 1]])
      );
      findRoundIndex = 0;
      showFindView(findPlay);
      renderFindRound();
    }

    function renderFindRound() {
      findRoundLocked = false;
      findProgress.textContent = `${findRoundIndex + 1} / 5`;
      findFeedback.textContent = 'Bir bayrak seç.';
      feedbackSpeaker.hidden = true;
      findDots.innerHTML = Array.from({ length: 5 }, (_, index) => {
        const state = index < findRoundIndex ? 'done' : index === findRoundIndex ? 'current' : '';
        return `<span class="find-dot ${state}"></span>`;
      }).join('');
      findFlags.innerHTML = findRounds[findRoundIndex].map((country, index) => `
        <button class="find-flag-card" type="button" data-turkey="${country.turkey === true}" data-index="${index}" aria-label="${country.name} bayrağı">
          <img src="${country.image}" alt="${country.name} bayrağı">
        </button>
      `).join('');
      findFlags.querySelectorAll('.find-flag-card').forEach(card => {
        card.addEventListener('click', () => chooseFindFlag(card));
      });
    }

    function chooseFindFlag(card) {
      if (findRoundLocked) return;
      if (card.dataset.turkey === 'true') {
        findRoundLocked = true;
        findFlags.querySelectorAll('.find-flag-card').forEach(button => { button.disabled = true; });
        card.classList.add('correct');
        ['one', 'two', 'three'].forEach(position => {
          const star = document.createElement('span');
          star.className = `card-sparkle ${position}`;
          star.textContent = '★';
          card.appendChild(star);
        });
        findFeedback.textContent = findCorrectText;
        feedbackSpeaker.hidden = false;
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        findInstructionAudio.pause();
        findSuccessAudio.pause();
        findSuccessAudio.currentTime = 0;
        findSuccessAudio.play().catch(() => {});
        launchFindConfetti();
        findRoundTimer = setTimeout(() => {
          findRoundIndex += 1;
          if (findRoundIndex >= 5) {
            showFindView(findFinish);
          } else {
            renderFindRound();
          }
        }, 1700);
      } else {
        card.classList.remove('try-again');
        void card.offsetWidth;
        card.classList.add('try-again');
        findFeedback.textContent = 'Bir daha deneyelim.';
        feedbackSpeaker.hidden = true;
        setTimeout(() => card.classList.remove('try-again'), 420);
      }
    }

    function startMemoryGame() {
      const shuffledCountries = shuffle(countries);
      gamePages = [];
      for (let start = 0; start < shuffledCountries.length; start += 4) {
        const pageCountries = shuffledCountries.slice(start, start + 4);
        gamePages.push(shuffle([...pageCountries, ...pageCountries]));
      }
      currentGamePage = 0;
      newGameButton.hidden = true;
      renderMemoryPage();
    }

    function renderMemoryPage() {
      openCards = [];
      matchedPairs = 0;
      boardLocked = false;
      gameFeedback.textContent = 'İki karta dokun';
      pageIndicator.textContent = `${currentGamePage + 1} / ${gamePages.length}`;
      nextGamePage.disabled = true;
      nextGamePage.innerHTML = currentGamePage === gamePages.length - 1
        ? '<span>Bitir</span><span class="button-arrow" aria-hidden="true">✓</span>'
        : '<span>İleri</span><span class="button-arrow" aria-hidden="true">→</span>';
      const cards = gamePages[currentGamePage];
      memoryGrid.innerHTML = cards.map((country, index) => `
        <button class="memory-card" type="button" data-name="${country.name}" data-audio="${country.audio}" data-index="${index}" aria-label="Kapalı bayrak kartı">
          <span class="card-inner">
            <span class="card-face card-front" aria-hidden="true"></span>
            <span class="card-face card-back">
              <img src="${country.image}" alt="${country.name} bayrağı">
            </span>
          </span>
        </button>
      `).join('');
      memoryGrid.querySelectorAll('.memory-card').forEach(card => {
        card.addEventListener('click', () => turnCard(card));
      });
      memoryGrid.classList.remove('page-enter');
      void memoryGrid.offsetWidth;
      memoryGrid.classList.add('page-enter');
    }

    function turnCard(card) {
      if (boardLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
      playCountryName(card.dataset.audio);
      card.classList.add('flipped');
      card.setAttribute('aria-label', `${card.dataset.name} bayrağı`);
      openCards.push(card);
      if (openCards.length < 2) return;
      boardLocked = true;
      const [first, second] = openCards;
      if (first.dataset.name === second.dataset.name) {
        first.classList.add('matched');
        second.classList.add('matched');
        gameFeedback.textContent = `✓ ${first.dataset.name}`;
        openCards = [];
        matchedPairs += 1;
        let matchFinished = false;
        const finishMatch = () => {
          if (matchFinished) return;
          matchFinished = true;
          playMatchSound();
          first.classList.add('removed');
          second.classList.add('removed');
          boardLocked = false;
          if (matchedPairs === gamePages[currentGamePage].length / 2) {
            const isLastPage = currentGamePage === gamePages.length - 1;
            gameFeedback.textContent = isLastPage
              ? 'Harika! Bütün eşleri buldun.'
              : 'Harika! Bu bölüm tamamlandı.';
            nextGamePage.disabled = false;
          }
        };
        countryAudio.addEventListener('ended', finishMatch, { once: true });
        setTimeout(finishMatch, 2500);
      } else {
        gameFeedback.textContent = 'Bir daha dene';
        setTimeout(() => {
          first.classList.remove('flipped');
          second.classList.remove('flipped');
          first.setAttribute('aria-label', 'Kapalı bayrak kartı');
          second.setAttribute('aria-label', 'Kapalı bayrak kartı');
          openCards = [];
          boardLocked = false;
          gameFeedback.textContent = 'İki karta dokun';
        }, 850);
      }
    }

    function showFlagScreen() {
      openingScreen.style.display = 'none';
      flagScreen.classList.add('active');
    }

    startButton.addEventListener('click', () => {
      startButton.disabled = true;
      openingAudio.currentTime = 0;
      openingAudio.play().catch(showFlagScreen);
    });
    openingAudio.addEventListener('ended', showFlagScreen);

    listenButton.addEventListener('click', () => {
      if (flagMusic.paused) {
        flagMusic.play();
        listenButton.textContent = '⏸ Durdur';
      } else {
        flagMusic.pause();
        listenButton.textContent = '▶ Dinle';
      }
    });
    flagMusic.addEventListener('ended', () => {
      listenButton.textContent = '▶ Dinle';
    });
    turkeyNameButton.addEventListener('click', () => {
      playCountryName('Türkiye.wav');
    });
    nextGamePage.addEventListener('click', () => {
      if (nextGamePage.disabled) return;
      if (currentGamePage < gamePages.length - 1) {
        currentGamePage += 1;
        renderMemoryPage();
      } else {
        nextGamePage.disabled = true;
        showActivityComplete();
      }
    });
    completeHomeButton.addEventListener('click', returnToOpeningScreen);
    findStartButton.addEventListener('click', startTurkeyFindGame);
    findReplayButton.addEventListener('click', startTurkeyFindGame);
    findHomeButton.addEventListener('click', showTurkeyFindIntro);
    instructionSpeaker.addEventListener('click', () => {
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      findInstructionAudio.pause();
      findInstructionAudio.currentTime = 0;
      findInstructionAudio.play().catch(() => {});
    });
    feedbackSpeaker.addEventListener('click', () => speakTurkish(findCorrectText));
    findContinueButton.addEventListener('click', () => {
      clearTimeout(findRoundTimer);
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      findInstructionAudio.pause();
      turkeyFindScreen.classList.remove('active');
      gameScreen.classList.add('active');
      startMemoryGame();
    });
    gameButton.addEventListener('click', () => {
      flagMusic.pause();
      listenButton.textContent = '▶ Dinle';
      showTurkeyFindIntro();
    });
    newGameButton.addEventListener('click', startMemoryGame);
  </script>
