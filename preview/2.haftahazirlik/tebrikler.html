<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tebrikler!</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden; font-family: Arial, sans-serif; background: linear-gradient(135deg, #f3e6ff, #d4b5f3 55%, #b786dd); }
    .confetti { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
    .confetti span { position: absolute; top: -45px; width: 15px; height: 28px; border-radius: 4px; animation: fall 4.5s linear infinite; }
    .confetti span:nth-child(1) { left: 8%; background:#ef6fa7; animation-delay:.2s; } .confetti span:nth-child(2) { left: 19%; background:#6b8ee8; animation-delay:1.3s; } .confetti span:nth-child(3) { left: 31%; background:#f1b848; animation-delay:.7s; } .confetti span:nth-child(4) { left: 44%; background:#62c7ab; animation-delay:2s; } .confetti span:nth-child(5) { left: 57%; background:#9a70d9; animation-delay:.5s; } .confetti span:nth-child(6) { left: 69%; background:#ef6fa7; animation-delay:1.7s; } .confetti span:nth-child(7) { left: 80%; background:#f1b848; animation-delay:1s; } .confetti span:nth-child(8) { left: 92%; background:#6b8ee8; animation-delay:2.4s; }
    .confetti span:nth-child(9) { left: 13%; background:#ff795e; animation-delay:2.8s; } .confetti span:nth-child(10) { left: 37%; background:#49c9dc; animation-delay:1.9s; } .confetti span:nth-child(11) { left: 62%; background:#ffcf45; animation-delay:3.1s; } .confetti span:nth-child(12) { left: 86%; background:#a8d84f; animation-delay:.9s; }
    @keyframes fall { to { transform: translateY(115vh) rotate(620deg); } }
    main { position: relative; z-index: 1; width: min(88vw, 570px); padding: 48px 28px; text-align: center; border: 2px solid rgba(255,255,255,.8); border-radius: 34px; background: rgba(255,255,255,.8); box-shadow: 0 25px 55px rgba(76,42,116,.25); }
    .trophy { font-size: 85px; line-height: 1; }
    h1 { margin: 20px 0 10px; color: #e85d9a; font-size: clamp(42px, 8vw, 66px); }
    p { margin: 0; color: #6f5392; font-size: clamp(18px, 3vw, 25px); font-weight: bold; }
  </style>
</head>
<body>
  <div class="confetti" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <main>
    <div class="trophy">🏆</div>
    <h1>Tebrikler!</h1>
    <p>Etkinliği tamamladın.</p>
  </main>
</body>
</html>
