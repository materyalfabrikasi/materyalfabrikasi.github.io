name: Publish site with material counts

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    # 09:23 Türkiye saati; GA verilerinin işlenmesi ayrıca gecikebilir.
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Configure credentials before enabling this publishing workflow.
    if: vars.PUBLIC_STATS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-stats.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node tests/public-stats-ui.cjs
      - name: Read aggregate Analytics counts
        env:
          GA_PROPERTY_ID: ${{ vars.GA_PROPERTY_ID }}
          STATS_START_DATE: ${{ vars.STATS_START_DATE }}
          GA_SERVICE_ACCOUNT_JSON: ${{ secrets.GA_SERVICE_ACCOUNT_JSON }}
        run: python scripts/export-material-stats.py
      - uses: actions/configure-pages@v5
      - name: Prepare public files
        run: |
          mkdir _site
          rsync -a ./ _site/ --exclude='_site/' --exclude='.git/' --exclude='.github/' --exclude='scripts/' --exclude='tests/' --exclude='docs/' --exclude='.*' --exclude='*.py' --exclude='README.md'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
